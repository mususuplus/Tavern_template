h3'}],['path',{d:'M15 6h1v4',key:'11y1tn'}],['path',{d:'m6.134 14.768.866-.5 2 3.464',key:'17snzx'}],['circle',{cx:'16',cy:'8',r:'6',key:'14bfc9'}]]),en=me('arrow-left',[['path',{d:'m12 19-7-7 7-7',key:'1l729n'}],['path',{d:'M19 12H5',key:'x3x0zl'}]]),nn=[{uid:51,id:'region_central_emerald_plain',name:'中央翡翠平原',aliases:['翡翠平原','圣罗兰城','平原腹地','绝境长城','银潮港','北境走廊','圣河','双誓丘','蓝麦镇','白石渡','泣鸦驿站'],content:'<region_central_emerald_plain>\n中央翡翠平原:\n  区域定位: 神圣罗兰帝国的政治、粮食与人口核心；人类和兽人共同生活最久、混居程度最高的地区\n  区域边界:\n    北部: 北境走廊连接凛冬山脉\n    西部: 林缘丘陵通往永夜森林\n    东部: 绝境长城外接灰烬荒原\n    南部: 圣河下游抵达银潮港，西南陆路通向枯萎前线\n  自然环境:\n    地貌: 圣河冲积平原为主体，北部缓丘、东部焦土和南部河网形成明显差异\n    气候: 四季分明；春季融雪易引发圣河洪水，秋季是征税、征兵和商队最密集的时期\n    战争影响: 越靠近东部，废弃农田、临时军墓、难民聚落和军需检查越常见\n  内部层次:\n    圣罗兰都城圈: 皇权、教权、贵族和魔法机构集中；法律严密，消息传播最快\n    平原腹地: 领主庄园、自由镇和教区村庄交错；承担帝国多数粮税与兵役\n    东部防区: 绝境长城及其后方军镇；军事法优先于地方领主法\n    南部河港带: 依靠圣河和银潮港形成的商业区域；外族人口、走私和新思想最多\n    北境走廊: 军事要塞与矮人商路并存；冬季常因封山与魔物迁徙中断\n  交通网络:\n    皇家驿道: 以圣罗兰城为中心连接四方；驿站提供换乘、官方文书验证和紧急征用\n    圣河航道: 大宗粮食与军需的主要运输线；由波顿家族船队和地方河运行会共同控制\n    长城军路: 禁止普通商队自由进入，需持军需署或远方行歌的通行文书\n    旅行尺度: 首都至银潮港顺流约六日，至绝境长城骑乘约九日，至北境走廊约十一日\n  生计与交换:\n    主要产出: 谷物、羊毛、皮革、河鱼、葡萄酒、军马和基础炼金原料\n    主要输入: 矮人金属与符文器具、精灵药材、以太结晶、海盐和海外香料\n    地方压力: 三百年战争令东部赋税、粮食征收和伤残军人安置成为长期矛盾\n  地方秩序:\n    法律层级: 皇帝敕令高于行省法；教会法处理信仰、婚契和异端；贵族法处理土地与徭役\n    种族现实: 罗兰盟约保障人类与兽人同等公民权，但贵族领地、行业传统和婚姻习俗仍存在隐性隔阂\n    冒险者地位: 登记冒险者可携带武器跨越多数领地，但必须接受地方治安官和教区祭司的联合检查\n  历史沉积:\n    双誓丘: 罗兰盟约最初宣誓地；丘上并列保存人类王冠和兽人战旗的石制复制品\n    旧王道: 帝国统一战争前的古道，部分路段被现代驿道取代；沿线散布旧诸侯堡垒与无主墓园\n    十二日魔潮遗迹: 东部仍保留被突破的旧城墙和封闭村庄；官方纪念碑没有记录魔国突然撤军的原因\n  普通生活:\n    集市节律: 村镇每五至十日举行集市，秋收后举办盟约节，人类与兽人家庭共同交换食物和手工品\n    信仰实践: 多数人同时尊奉光明之神的契约秩序和与职业相关的其他神祇，并非严格单一信仰\n    战争痕迹: 几乎每个家庭都有前线服役者；阵亡通知、军饷拖欠和退伍伤病是常见生活议题\n  当前矛盾:\n    - 皇室要求增加东部军费，波顿家族和腹地领主反对继续加税\n    - 光明神教借异常魔法事件扩大审查权，与皇家魔法学院冲突\n    - 难民持续进入自由镇，引发土地、粮价和治安争议\n    - 圣河沿岸出现无法被法术净化的银白色魔力沉积\n  待展开地点:\n    蓝麦镇: 平原腹地的自由镇；退伍军人、粮商和逃避领主徭役者聚居\n    双誓丘: 罗兰盟约纪念地；每次皇位继承都必须在此重宣盟约\n    白石渡: 圣河中游最大渡口；控制东部粮运，也是走私者争夺的节点\n    泣鸦驿站: 长城军路最后一座民用驿站；失踪军士的家属长期在此等待消息\n</region_central_emerald_plain>',shortName:'翡翠之心',accent:'#75d6a2',sculpture:'emerald'},{uid:52,id:'region_northern_winter_mountains',name:'北方凛冬山脉',aliases:['凛冬山脉','北境山脉','铁门关','石桥市场','卡兹莫丹地下城','熔火深渊','热能波动观测所','断锤古道','雪炉村','白息湖','沉钟矿坑'],content:'<region_northern_winter_mountains>\n北方凛冬山脉:\n  区域定位: 大陆金属、符文工业和地热技术中心；地表严寒荒凉，山体内部形成庞大的矮人文明\n  区域边界:\n    南麓: 经北境走廊连接中央翡翠平原\n    西南: 林脉交界处通向永夜森林\n    北部: 永久冰原与未测绘山地，正式地图止于白息湖\n    地下: 卡兹莫丹矿道向地脉层延伸，部分深井已超出行会控制\n  自然环境:\n    垂直气候: 山麓针叶林、雪线冻原和高峰冰原依海拔分层；暴风雪可在半日内封闭道路\n    地质活动: 地热、矿脉和根源地脉互相交叠；熔炉抽取过量会引发热能波动和符文失准\n    生存规则: 地表旅行必须携带保温符石、风向绳和三日以上燃料；夜间离开标记道路极易失温\n  内部层次:\n    南麓关隘带: 铁门关、石桥市场和帝国商站集中；是外族能自由进入的主要区域\n    苍炉盆地: 数个依靠地热生存的地表聚落；居民为猎人、矿工家属和商路维护者\n    卡兹莫丹地下城: 上层贸易、中层生活、下层工业和熔火禁区组成的垂直城市\n    深钻边区: 新矿脉、废弃前哨和未知洞穴交错；行会法律在此常被探勘队自治规则取代\n    永久冰原: 无固定统治；散布古代观测设施和被冰封的战争遗迹\n  交通网络:\n    断锤古道: 帝国与铁门关之间最稳定的商路；沿途石桩由矮人工匠定期重刻方向符文\n    山腹货梯: 连接地下城各层的大型配重升降系统；军需和矿石运输优先于旅客\n    深层轨道: 蒸汽矿车仅在行会控制区运行；越过红色警示符文后不保证轨道终点仍存在\n    旅行尺度: 北境走廊至铁门关约五日；铁门关至地下城中层需半日检查与换乘\n  生计与交换:\n    主要产出: 铁、黑铁、银、符文石、火药、精密工具、重型军械和熔岩酿\n    主要输入: 粮食、木材、药草、布匹和地表情报\n    劳动制度: 行会成员以工时、技艺和事故责任计酬；重大工程形成的债务可由家族继承\n  地方秩序:\n    行会法: 工艺秘密、矿权和工程安全高于个人财产权；破坏公共承重结构被视为重罪\n    外来者限制: 只能在登记路线活动；携带未申报的传送道具会被视为渗透行为\n    荣誉习惯: 矮人很少以决斗处理争端，更常以公开工艺检验、债务担保或危险任务裁决责任\n  历史沉积:\n    初炉迁徙: 诸神黄昏后，矮人先祖因地表寒灾迁入山腹并发现熔火深渊\n    四锤协定: 四大行会结束矿权战争，共同建立首席大工匠制度\n    沉钟事故: 一座深层矿城在一次钟声后与地下城失去联系；官方将其列为永久封闭矿区\n  普通生活:\n    时间感: 地下居民以换班钟、熔炉温度和公共灯石颜色区分时段，不依赖日出日落\n    家庭结构: 行会学徒常由多个家庭共同抚养；师承关系与血缘同样重要\n    饮食: 菌菇、硬面包、腌肉和烈酒为主；新鲜水果在中层市场被视为昂贵礼物\n  当前矛盾:\n    - 熔火深渊热能读数持续升高，行会对是否停炉争执不下\n    - 帝国要求增加军械供应，矿工和工程师反对继续压缩安全周期\n    - 深钻队发现被人为抹去的古代方向符文，疑似通向根源地脉\n    - 铁血福音正在招募对行会制度不满的年轻工匠\n  待展开地点:\n    雪炉村: 苍炉盆地最大的地表聚落；依靠公共地热井和商队修理维生\n    白息湖: 永久冰原边缘的冰下湖；冬季会从冰层下传出规律敲击\n    沉钟矿坑: 已封闭百余年的旧矿城入口；矿工名册仍会自动增加新名字\n    断锤古道: 旧矮人王国修建的石道；部分路标指向现有地图不存在的山谷\n</region_northern_winter_mountains>',shortName:'凛冬山冠',accent:'#b8dcff',sculpture:'winter'},{uid:53,id:'region_western_evernight_forest',name:'西方永夜森林',aliases:['永夜森林','森林议会领地','月辉议厅','月亮井群','藤桥聚落','大图书馆','世界树之根','林缘交易所','星落溪谷','无冠林地','旧誓门','苔灯村'],content:'<region_western_evernight_forest>\n西方永夜森林:\n  区域定位: 围绕世界树形成的垂直森林文明；精灵议会控制核心区，森林本身也会通过路径变化排斥破坏者\n  区域边界:\n    东部: 林缘交易所连接中央翡翠平原\n    北部: 与凛冬山脉交界的寒林带\n    南部: 无名荒芜正在侵蚀的褪色林线\n    西部: 树冠持续增高，地图记录止于星落溪谷\n  自然环境:\n    光照: 树冠遮蔽形成长期暮色；月亮井、发光菌类和引光藤构成主要照明\n    垂直生态: 树冠层干燥多风，林地层温和，根系层潮湿稳定；不同层级拥有独立水源与道路\n    路径规则: 未获森林认可者会遇到重复地标；砍伐活木、污染水源或携带明火会加重迷途\n  内部层次:\n    树冠圣域: 月辉议厅、月亮井群和月影氏族居所；外族进入必须由祭司担保\n    林地聚落带: 藤桥聚落、大图书馆和氏族工坊集中；人口最多，对外来文化最开放\n    根系层: 世界树之根、沉睡墓园和绿苔氏族领地；时间感与地表存在轻微偏差\n    林缘缓冲带: 贸易、外交和外族居住集中；议会法律与边境习惯并存\n    南部褪色林: 叶片、声音和生物名称逐步消失；荆棘氏族建立连续观察哨\n  交通网络:\n    藤桥网: 连接树冠与林地聚落；桥梁会随季节生长，需要当地引路人辨识\n    根脉舟: 沿世界树地下水道航行的小型活木舟，只由绿苔氏族操纵\n    星痕路: 寻星氏族依据夜间星光校准的林间道路，是少数不会主动改变方向的路线\n    旅行尺度: 林缘至月辉议厅约四日；未经许可者通常需要两倍时间\n  生计与交换:\n    主要产出: 药草、活木器具、月井药剂、星图、树脂、菌类和精灵弓具\n    主要输入: 金属工具、盐、玻璃、纸张和部分谷物\n    取用伦理: 土地与古树不被视为私产；采集额度由氏族按生态恢复速度分配\n  地方秩序:\n    议会法: 破坏生态记忆比盗窃财物更严重；重大罪犯会被剥夺使用森林道路的资格\n    氏族差异: 月影重礼仪，荆棘重安全，寻星重记录，绿苔重生态延续；同一行为在不同领地可能受到不同评价\n    外来者身份: 商人、学者和使节分别使用不同通行叶印，越权进入会触发活木守卫\n  历史沉积:\n    世界树萌生: 精灵历法以世界树第一次发芽为元年，但最早年轮中存在无法解释的烧灼层\n    无冠分裂: 曾有一支氏族拒绝接受议长否决权，名称和席位后来从正式史书中消失\n    南枝凋亡: 两百年前世界树南侧巨枝突然死亡，成为无名荒芜最早被系统记录的征兆之一\n  普通生活:\n    时间习惯: 精灵以月相、花期和树液流动记录时间；对短寿种族的精确钟点习惯并不适应\n    纪念方式: 死者姓名被刻入活木，树皮愈合后由口述史保留其经历\n    跨族接触: 年轻精灵常在林缘学习通用语和外界计价，长老担忧这种生活会削弱氏族记忆\n  当前矛盾:\n    - 南部褪色林持续扩大，议会对撤离还是固守无法达成七席多数\n    - 无冠氏族的遗物重新出现，可能证明官方历史经过删改\n    - 帝国要求开放森林军道，荆棘氏族支持有限合作，绿苔氏族坚决反对\n    - 世界树根系出现不属于噬根之蛇的啃蚀痕迹\n  待展开地点:\n    星落溪谷: 森林西部唯一能直接看到完整星空的裂谷；寻星氏族在此校正预言\n    无冠林地: 所有树木天然向外弯曲的空地；旧氏族标记会在雨后浮现\n    旧誓门: 精灵与帝国第一次签订边境协定的活木门；门体开始拒绝承认现行条约\n    苔灯村: 林缘外族与精灵共同居住的聚落；议会法律在此执行得最为宽松\n</region_western_evernight_forest>',shortName:'永夜月林',accent:'#a8d97b',sculpture:'forest'},{uid:54,id:'region_eastern_redsand_desert',name:'东方赤砂荒漠',aliases:['赤砂荒漠','东方荒漠','流沙之海','半埋之城','寂静画廊','沙棘要塞','古井镇','苍盐城','烛沙驿','落星台','玻璃原'],content:'<region_eastern_redsand_desert>\n东方赤砂荒漠:\n  区域定位: 古代文明遗迹、商队路线和无主聚落交错的东方边地；没有统一政权，水源与路线构成实际权力\n  区域边界:\n    西部: 经帝国东南商道连接翡翠平原\n    北部: 风蚀高地延伸至凛冬山脉支脉\n    南部: 沙丘逐渐转为枯萎之地的褪色荒原\n    东部: 玻璃原和破碎海岸，尚无可靠完整地图\n  自然环境:\n    地貌: 移动沙丘、干涸河床、盐湖、风蚀石林和被掩埋的城市层叠分布\n    气候: 昼夜温差极大；沙暴季会重塑道路并露出短暂存在的遗迹入口\n    魔力现象: 古代术式仍在地下运行，局部会出现无来源光照、重复回声和方向失真\n  内部层次:\n    西部商路带: 沙棘要塞、烛沙驿和商队营地密集；帝国与远方行歌影响较强\n    中部流沙之海: 道路随季节变化；沙舟和本地向导是主要通行方式\n    失落遗迹群: 半埋之城、寂静画廊和大量无名遗址；遗物猎人、学者与盗掘者长期争夺\n    南部枯沙带: 无名荒芜与沙漠接触区；地图、地名和路标比实物更早消失\n    东部玻璃原: 地表被远古高温熔成深色玻璃；雷雨时会映出已经毁灭的城市轮廓\n  交通网络:\n    三井商路: 依次经过烛沙驿、古井镇和苍盐城；三个水源点中任何一个关闭都会令贸易停摆\n    沙舟航线: 利用固定风带横越流沙之海；只有持风纹牌照的领航者能合法载客\n    星影路: 夜间依据古代观星塔阴影辨路；白昼无法确认其存在\n    旅行尺度: 西部边境至古井镇约七日，古井镇至半埋之城约四日，横越玻璃原至少十二日\n  生计与交换:\n    主要产出: 盐、耐旱药材、遗物、彩色玻璃、沙舟零件和路线情报\n    主要输入: 粮食、布匹、木材、金属工具、净水药剂和牲畜饲料\n    水权制度: 水源不完全归土地所有者；古井镇、苍盐城等地由多方共同见证取水规则\n  地方秩序:\n    商队公约: 任何队伍不得拒绝向脱水旅人出售一日用水，但可在抵达下个水源后追偿\n    遗物归属: 地表遗物归发现者，地下成组遗物须向查验机构登记；实际执行因地点而异\n    中立传统: 多数绿洲禁止势力公开交战，违反者会被全体向导和水商拒绝服务\n  历史沉积:\n    赤日坠落: 诸神黄昏末期的高温灾变形成玻璃原，具体原因被不同神殿解释为不同神迹\n    河国时代: 荒漠曾存在依靠地下水网繁荣的城邦群；河流消失的时间早于现有历史记录\n    第一次封画: 寂静画廊曾由七支队伍共同封闭，只有六支队伍的名字留在纪念碑上\n  普通生活:\n    聚落节律: 清晨和黄昏活动，正午封门休息；夜市承担交易、婚约和消息交换\n    名字习惯: 商队成员会同时使用本名和路名，避免某些遗迹通过名字追踪进入者\n    信任凭证: 水囊封签、路线木牌和共同走过的路程比贵族文书更受重视\n  当前矛盾:\n    - 三井商路水位同时下降，水商指责遗迹开掘破坏地下水网\n    - 寂静画廊附近出现被画入墙面的失踪者，部分人物仍能短暂说话\n    - 星语协会要求垄断高危遗物，远方行歌与本地向导拒绝接受\n    - 玻璃原映出的古城中出现与主角相貌相似的人影\n  待展开地点:\n    苍盐城: 建在干涸盐湖中央的商队城；以盐债、储水库和路线仲裁维持秩序\n    烛沙驿: 三井商路西端驿站；每场沙暴后都要重新清点住客，人数经常多出一个\n    落星台: 河国时代的观星遗址；星图记录着现今天空中不存在的星辰\n    玻璃原: 远古灾变留下的黑色平原；雷光会短暂照出地下完整街道\n</region_eastern_redsand_desert>',shortName:'赤砂遗梦',accent:'#e7ae62',sculpture:'desert'},{uid:55,id:'region_southern_withered_land',name:'南方枯萎之地',aliases:['枯萎之地','南方禁区','前线联合大营','补给中转站','法则紊乱区','幽灵方舟停泊点','归零点','灰界镇','留名站','退色路','空钟村'],content:'<region_southern_withered_land>\n南方枯萎之地:\n  区域定位: 无名荒芜持续侵蚀形成的法则衰退区；文明只能在边缘建立临时秩序，越深入越难维持名称、记忆和物理属性\n  区域边界:\n    北部: 帝国南方防线、灰界镇和补给网络\n    西北: 永夜森林南部褪色林\n    东北: 赤砂荒漠南部枯沙带\n    中心: 归零点；其真实范围无法通过固定测量确认\n  环境分层:\n    边缘警戒区: 物理规则基本稳定，但颜色变淡、声音迟滞和短期失忆已较常见\n    法则紊乱区: 重力、距离、温度和时间流速不稳定；队伍必须使用多种测量方式交叉确认\n    名称衰退区: 物品先失去专名，再失去用途，最后从观察和记忆中消失\n    虚无中心: 地图只标记为归零点；任何关于内部的报告都会逐渐变成空白\n  生存与交通:\n    退色路: 由连续替换的彩色石桩标记；石桩完全褪色前必须撤离或补设\n    返程绳列: 探索队将不同材质的绳索并行铺设，避免单一材料规则失效导致迷失\n    留名规程: 成员每隔一小时互报姓名、目的和人数，并在纸张、金属、记忆术式三种介质上同步记录\n    旅行限制: 普通队伍不得越过第三返程线；巡查使和秘银级队伍需携带强制撤离信标\n  生计与交换:\n    主要需求: 净化盐、替换装备、多介质记录工具、稳定药剂和心理治疗\n    主要产出: 异常样本、失效法则记录和极少量虚无结晶；所有样本必须在边缘区隔离\n    前线经济: 补给承包、探索委托和遗物走私并存；大量商品因污染风险只能单向进入\n  地方秩序:\n    联合管制: 帝国军、观测者和远方行歌共同维持边缘秩序，但三方对救援成本与研究权限长期冲突\n    身份确认: 返回者须通过记忆问答、身体标记和同行证词三重检查，防止无名替代现象\n    死亡认定: 失踪者在一年后可被宣告死亡，但若姓名也开始消失，档案员会优先保存其社会关系而非生平细节\n  历史沉积:\n    第一次归零: 一座南方行省城市从地图、家谱和道路中同时消失，帝国税册仅留下无法解释的人口差额\n    三线撤退: 帝国曾三次向北移动警戒线；旧营地仍可能在规则暂时恢复时出现\n    留名站制度: 一支全员失忆但成功返程的巡查队促成现行记录规程\n  普通生活:\n    边民习惯: 家庭成员每天互相讲述共同记忆；衣物内侧缝有姓名、亲属和返乡路线\n    葬仪: 找不到遗体或姓名开始褪去时，家属会保存死者使用过但尚未失去用途的物件\n    驻地文化: 前线人员避免使用“永久”“绝对”和“不会改变”等表达，认为这是对环境的挑衅\n  当前矛盾:\n    - 警戒线在地图上未变，实地褪色边界却已向北推进十二里\n    - 返回者中出现记忆完整但没有任何出发记录的人\n    - 灭世教派正在收集被抹除者留下的关系记录，目的不明\n    - 观测者内部争论是否应主动制造小规模归零以研究荒芜规律\n  待展开地点:\n    灰界镇: 最近一次撤退后形成的边境镇；由难民、前线家属和补给商共同维持\n    留名站: 每条深入路线的最后登记处；保存多种材质制成的人员档案\n    空钟村: 已无人记得村名来源，钟楼每天仍会在同一时刻无声摆动\n    退色路: 通往旧警戒线的主路；部分路段会让旅行者忘记自己来自哪个方向\n</region_southern_withered_land>',shortName:'退色前沿',accent:'#c59a9d',sculpture:'withered'},{uid:56,id:'region_shadow_domain',name:'暗影领域',aliases:['魔国领土','魔国统治区','灰烬荒原','前线堡垒群','骸骨工场','暗影裂谷','深渊王座','乌曜城','断旗镇','黑雨盆地','无月道'],content:'<region_shadow_domain>\n暗影领域:\n  区域定位: 魔国控制的军事化领土；并非完全无人荒地，而是由被占领城市、同化聚落、兵工设施和暗影核心区组成的统治体系\n  区域边界:\n    西北: 面向绝境长城的灰烬荒原\n    西南: 与枯萎之地接触的法则混杂带\n    东部: 破碎山地和尚未完全同化的旧王国废墟\n    核心: 暗影裂谷及悬浮于其中的深渊王座\n  自然环境:\n    光照: 天空长期被暗影尘遮蔽；越接近裂谷，自然光越难形成清晰边界\n    同化梯度: 灰烬荒原允许常规生物短期活动，裂谷外围会持续侵蚀情绪与记忆，核心区直接压制独立意志\n    黑雨: 暗影能量凝结形成的降水；会污染水源并加速一阶浸染\n  内部层次:\n    灰烬前线: 堡垒、补给点和旧战场密集；魔潮从此集结并向绝境长城推进\n    占领聚落带: 保留部分旧城镇结构，以未化者劳动和影从行政维持生产\n    战争工业带: 骸骨工场、同化试验场和黑铁铸造设施集中\n    暗影裂谷: 映体与虚相活动区域；普通影从未经召令也不得进入\n    王座核心: 魔王权能最强处；命令可通过暗影网络直接传达至各级统治者\n  交通网络:\n    无月道: 连接前线堡垒和裂谷的军用道路；路面会吸收脚步与车轮留下的痕迹\n    影门: 依靠暗影浓度运行的短距传送节点，只允许持有王令烙印者使用\n    骸骨输送线: 从旧战场向工场运输残骸的固定路线，沿途由虚相守卫看守\n    潜入限制: 帝国地图多来自百年前；占领区名称和道路已被魔国系统性重编\n  生计与控制:\n    主要产出: 军械、暗影结晶、同化兵员、被掠夺的矿物和前线情报\n    配给制度: 影从按服从记录、劳动价值和军事贡献领取食物与暗影稳定剂\n    统治方式: 魔国允许地方保留有限习俗，只要不妨碍征兵、生产和绝对服从链\n  地方秩序:\n    挑战律: 下位者可公开挑战直接上位者，但挑战需要见证并承担失败即死的结果\n    未化者管理: 未化者不能持有武器、地图和私人通信物；部分技术人员会被暂缓同化\n    自我残留: 影从保留的个性程度不一，私人交易、秘密家庭和旧信仰因此从未彻底消失\n  历史沉积:\n    裂谷旧国: 魔王崛起前，暗影裂谷周边存在数个小国；其名称被魔国从官方记录中删除\n    灰冠叛乱: 一名映体领主曾率领影从反抗魔王，失败后相关堡垒和部队编号被彻底取消\n    第一座骸骨工场: 建于十二日魔潮后，使用的部分残骸来自魔国自身突然撤退的军队\n  普通生活:\n    占领区居民: 白天在配给和劳动制度下生活，夜间通过旧歌谣、食谱和家庭称谓保存被禁止的身份\n    影从关系: 公开场合强调上下位，私人生活仍存在友情、婚姻和亲缘，但可能被命令随时切断\n    抵抗方式: 隐藏真实姓名、伪造服从记录、破坏配给账目和帮助未化者逃亡比公开战斗更常见\n  当前矛盾:\n    - 前线魔潮准备规模空前，但部分映体接到互相冲突的王令\n    - 黑雨盆地出现不会被暗影同化的水源，引发军方与居民争夺\n    - 灰冠叛乱者的旧标志在占领聚落重新出现\n    - 骸骨工场收到来自尚未发生战役的阵亡者残骸\n  待展开地点:\n    乌曜城: 魔国最大的占领城市；旧城行政仍在暗影官僚体系下运转\n    断旗镇: 临近前线的影从聚落；居民暗中保存被征服国家的旗帜碎片\n    黑雨盆地: 暗影降水汇聚区；中央泉眼近期出现净化迹象\n    无月道: 王座与前线之间的军路；沿途里程碑记录的距离每天都在缩短\n</region_shadow_domain>',shortName:'暗影裂境',accent:'#b795ff',sculpture:'shadow'},{uid:57,id:'region_floating_domain',name:'浮空疆域',aliases:['浮空城','浮空岛链','天际港','语石群岛','七座主塔','无尽书廊','空港码头','坠星礁','断锚岛','候风站','静风环'],content:'<region_floating_domain>\n浮空疆域:\n  区域定位: 由天然浮空岩、古代锚定术和移动城市构成的空中网络；星语协会与远方行歌分别控制知识节点和交通节点\n  空间结构:\n    语石群岛: 固定于帝国东北上空的学术群岛；七座主塔通过以太桥梁相连\n    天际港: 沿大陆高空风带缓慢移动的城市；约三年完成一次主大陆巡航\n    外围浮岛: 无固定政权的小型岛屿；包括农场、采矿点、观测站和空盗藏身处\n    坠落带: 浮力衰减后形成的碎岩区域；旧航图上标记的岛屿可能已经落向地面\n  自然环境:\n    浮力来源: 浮空岩内部的以太晶脉与地表魔网共振；晶脉耗损会导致高度缓慢下降\n    高空气候: 风速、温度和魔力密度变化剧烈；风暴会干扰传送、通讯和锚定术\n    静风现象: 某些区域完全没有气流，飞空艇进入后只能依靠魔法或拖曳离开\n  交通网络:\n    高空风路: 由远方行歌定期测绘；航路按季节和魔力潮汐调整\n    锚塔体系: 地表高塔和山顶平台为浮空城市提供停靠、补给与人员交换\n    飞空艇: 大型货艇依靠浮空石减重、风帆推进；高速小艇依赖昂贵的魔力驱动\n    传送限制: 语石群岛内部传送稳定，跨区域传送需提前校准目的地锚点\n    旅行尺度: 语石群岛至圣罗兰城飞行约一日；天际港位置不同，抵达时间从数日到数月不等\n  生计与交换:\n    主要产出: 魔法研究、航路情报、浮空石、精密仪器、稀有高空药材和远程运输服务\n    主要输入: 粮食、淡水、木材、金属和大量维护锚定术的以太结晶\n    水源: 通过集云术、雨水回收和地表补给维持；长期静风会迅速造成供水压力\n  地方秩序:\n    语石群岛: 协会规章优先，研究密级决定通行范围；未经许可的飞行和传送会被强制截断\n    天际港: 圆桌公约优先，持牌冒险者拥有较高行动自由；重大纠纷由跨区仲裁庭处理\n    外围浮岛: 常依靠岛主契约、船队习惯或临时武力维持秩序\n  历史沉积:\n    升空时代: 诸神黄昏后部分陆地因魔网断裂升入天空，最早浮岛并非人工制造\n    七塔锚定: 星语协会创始人将语石群岛固定，代价是七塔必须持续消耗魔力维持共同术式\n    天际港失速: 八十年前城市曾在静风环停滞九个月，期间形成今日圆桌议会的紧急权力制度\n    第八锚点: 旧航图显示语石群岛曾连接一座未列入七塔体系的岛屿，现已从官方记录删除\n  普通生活:\n    空岛居民: 对天气、载重和物资循环极为敏感；向地面丢弃物品被视为严重失礼\n    身份习惯: 居民常以出生岛、所属船队或航路代替地面领地作为籍贯\n    丧葬: 多数人将骨灰封入轻石匣送入高空气流，少数家庭坚持送回地面安葬\n  当前矛盾:\n    - 语石群岛高度每年下降，协会隐瞒了锚定术的实际损耗\n    - 天际港的新航线经过魔国上空，圆桌议会对风险与利益争执不下\n    - 外围浮岛接连失踪，但地面没有发现坠落痕迹\n    - 无尽书廊出现来自未来日期的借阅记录\n  待展开地点:\n    坠星礁: 大量浮空碎岩组成的危险航区；残骸中保存着不同年代的飞行器\n    断锚岛: 与语石群岛失去连接的旧学术岛；仍沿不存在的桥梁周期移动\n    候风站: 远方行歌设立的中立航路驿站；船员在此交换最新风图\n    静风环: 环绕大陆北部的无风区域；进入其中的声音会比发声者更晚抵达\n</region_floating_domain>',shortName:'天穹群塔',accent:'#77d8dd',sculpture:'sky'}],tn=[{uid:69,id:'scene_shadow_rift',name:'暗影裂谷',aliases:['深渊王座','黑暗议会厅','夜魇巢穴','裂谷悬桥','影化祭坛'],content:'<scene_shadow_rift>\n暗影裂谷:\n  定位: 魔国核心深渊，魔王权能最集中的区域\n  所属区域: 暗影领域\n  主要地点:\n    - 深渊王座\n    - 黑暗议会厅\n    - 夜魇巢穴\n    - 裂谷悬桥\n    - 影化祭坛\n  场景规则:\n    - 裂谷内没有稳定昼夜，自然光会被暗影层层吞没\n    - 深渊王座悬浮在裂谷深处，是魔国政治与神权象征\n    - 黑暗议会厅处理军事战略、同化政策和对外渗透计划\n    - 常见事件包括潜入、囚禁、影化审判、禁卫追猎、魔国高层召见\n</scene_shadow_rift>',region:'暗影领域'},{uid:115,id:'scene_broken_banner_town',name:'断旗镇',aliases:['断旗镇征兵场','黑旗配给所','旧裁缝巷','断旗镇前线驿棚','碎旗藏窖'],content:'<scene_broken_banner_town>\n断旗镇:\n  定位: 临近前线的影从聚落，部分居民暗藏被征服国家的旗帜碎片\n  所属区域: 暗影领域\n  主要地点:\n    - 征兵场\n    - 黑旗配给所\n    - 旧裁缝巷\n    - 前线驿棚\n    - 碎旗藏窖\n  场景规则:\n    - 公开展示旧国旗帜会触发搜查与惩处，碎片持有者及其网络不预先指定\n    - 前线征兵、军需征用和封路命令优先于镇内日常秩序\n    - 告密记录受暗影官署采用，但未经核验的指控仍可能成为派系报复工具\n    - 常见事件: 逐户搜旗、强征兵员、逃亡协助、告密指控与军需征用\n</scene_broken_banner_town>',region:'暗影领域'},{uid:89,id:'scene_boneworks',name:'骸骨工场',aliases:['骸骨巨兽','魔国兵工厂','骨架拼接场','黑铁铆钉台','亡灵驱动炉','残骸分拣坑','监工高台'],content:'<scene_boneworks>\n骸骨工场:\n  定位: 魔国组装骸骨巨兽和死灵战争器械的露天兵工厂\n  所属区域: 暗影领域\n  主要地点:\n    - 骨架拼接场\n    - 黑铁铆钉台\n    - 亡灵驱动炉\n    - 残骸分拣坑\n    - 监工高台\n  场景规则:\n    - 工场以战场残骸、巨兽骨骼、黑铁零件和暗影驱动炉制造战争造物\n    - 亡灵驱动炉被破坏会导致半成品失控\n    - 常见事件: 破坏任务、俘虏劳役、巨兽启动、材料争夺、死灵污染外泄\n</scene_boneworks>',region:'暗影领域'},{uid:116,id:'scene_black_rain_basin',name:'黑雨盆地',aliases:['黑雨盆地中央泉眼','黑雨蓄池','军方抽水站','居民取水队','污染泄流沟'],content:'<scene_black_rain_basin>\n黑雨盆地:\n  定位: 暗影降水汇聚的低地，中央泉眼近期出现局部净化迹象\n  所属区域: 暗影领域\n  主要地点:\n    - 中央泉眼\n    - 黑雨蓄池\n    - 军方抽水站\n    - 居民取水队\n    - 污染泄流沟\n  场景规则:\n    - 普通积水视为污染源，长期接触会加速一阶暗影浸染\n    - 泉眼净化是近期现象，成因、范围和持续时间均未确认\n    - 军方与居民围绕取水权持续冲突，泉眼归属尚未裁定，双方均未取得稳定控制\n    - 常见事件: 水源接管、样本检测、投毒指控、取水骚乱与净化度波动\n</scene_black_rain_basin>',region:'暗影领域'},{uid:87,id:'scene_ashen_wastes',name:'灰烬荒原',aliases:['暗影裂谷外围','魔国外围','灰烬路','枯骨哨塔','黑旗补给点','影从巡逻线','破碎战场'],content:'<scene_ashen_wastes>\n灰烬荒原:\n  定位: 暗影裂谷外围缓冲区，魔国向帝国前线推进的地表通道\n  所属区域: 暗影领域\n  主要地点:\n    - 灰烬路\n    - 枯骨哨塔\n    - 黑旗补给点\n    - 影从巡逻线\n    - 破碎战场\n  场景规则:\n    - 地表覆盖黑灰与旧战场残骸，脚印和血迹会被暗影缓慢吞没\n    - 魔国斥候、影从巡逻队、骸骨搬运队经常穿行\n    - 常见事件: 斥候遭遇、战场搜救、暗影伏击、补给线破坏、俘虏转运\n</scene_ashen_wastes>',region:'暗影领域'},{uid:88,id:'scene_demon_front_forts',name:'前线堡垒群',aliases:['魔国前线堡垒','黑旗堡垒','黑旗主堡','影从兵营','战俘地牢','攻城兽栏','暗影烽塔'],content:'<scene_demon_front_forts>\n前线堡垒群:\n  定位: 魔国面向绝境长城的军事跳板\n  所属区域: 暗影领域\n  主要地点:\n    - 黑旗主堡\n    - 影从兵营\n    - 战俘地牢\n    - 攻城兽栏\n    - 暗影烽塔\n  场景规则:\n    - 堡垒服务于进攻、囚禁、审讯、补给和暗影渗透\n    - 战俘会按价值分流至地牢、同化试验、骸骨工场或谈判筹码\n    - 常见事件: 潜入侦察、战俘营救、攻城准备、烽塔点燃、军官刺杀\n</scene_demon_front_forts>',region:'暗影领域'},{uid:90,id:'scene_abyssal_throne',name:'深渊王座',aliases:['魔王王座','魔国王座','王座平台','黑阶长桥','王令回声厅','影冠祭坛','禁卫环廊'],content:'<scene_abyssal_throne>\n深渊王座:\n  定位: 魔王居所与魔国神权象征，悬浮于暗影裂谷深处\n  所属区域: 暗影领域\n  主要地点:\n    - 王座平台\n    - 黑阶长桥\n    - 王令回声厅\n    - 影冠祭坛\n    - 禁卫环廊\n  场景规则:\n    - 王座区域的暗影能量会压低独立意志，使弱者更容易服从命令\n    - 只有魔国高层、禁卫和被召见者能接近王座平台\n    - 常见事件: 魔王召见、王令宣告、禁卫审判、意志压迫、叛徒处决\n</scene_abyssal_throne>',region:'暗影领域'},{uid:114,id:'scene_obsidian_city',name:'乌曜城',aliases:['乌曜旧政厅','王令档案署','影从配给场','未化者工区','乌曜城旧城下街'],content:'<scene_obsidian_city>\n乌曜城:\n  定位: 魔国最大的占领城市，旧城行政被保留并嵌入暗影官僚体系\n  所属区域: 暗影领域\n  主要地点:\n    - 乌曜旧政厅\n    - 王令档案署\n    - 影从配给场\n    - 未化者工区\n    - 旧城下街\n  场景规则:\n    - 旧行政机构服从王令、征兵与生产要求，旧法只在不冲突时继续使用\n    - 配给按服从记录、劳动价值和军事贡献发放，记录异常会直接影响生存物资\n    - 未化者不得合法持有武器、地图或私人通信物，违者会被送往审查\n    - 常见事件: 配给账伪造、强制征工、旧法与王令冲突、抵抗传信与黑雨隔离\n</scene_obsidian_city>',region:'暗影领域'},{uid:117,id:'scene_moonless_road',name:'无月道',aliases:['无月道缩距里程碑','王座端关卡','暗影补给棚','无痕路段','前线端驿点'],content:'<scene_moonless_road>\n无月道:\n  定位: 连接深渊王座与前线的军路，里程碑所记距离每天都会缩短\n  所属区域: 暗影领域\n  主要地点:\n    - 王座端关卡\n    - 缩距里程碑群\n    - 暗影补给棚\n    - 无痕路段\n    - 前线端驿点\n  场景规则:\n    - 路面会吸收脚印与车辙，追踪与回程不能依赖常规痕迹\n    - 合法通行受王令烙印和军务管制，民间队伍无法自由使用\n    - 里程变化须先记录并交叉测量，不直接解释为道路本身实际缩短\n    - 常见事件: 里程争议、王令递送、押运伏击、运输队失踪与影门故障\n</scene_moonless_road>',region:'暗影领域'},{uid:99,id:'scene_whitebreath_lake',name:'白息湖',aliases:['白息湖测冰桩','白息湖旧观测屋','白息湖取水孔','白息湖北岸避风洞'],content:'<scene_whitebreath_lake>\n白息湖:\n  定位: 永久冰原边缘的冰下湖，现行正式地图止于其北岸\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 湖面标记道\n    - 测冰桩列\n    - 旧观测屋\n    - 取水孔\n    - 北岸避风洞\n  场景规则:\n    - 旅队仅沿测冰标记行动；裂纹、雾气或桩位异常时必须撤回\n    - 冰下会传来规律敲击，其来源尚未确认，不直接解释为生物或讯号\n    - 越过北岸即进入未测绘地带，旧地图与口述路线均不能作为可靠导航\n    - 常见事件: 冰裂救援、敲击规律改变、观测员失联、标记桩移位与冰下遗迹显露\n</scene_whitebreath_lake>',region:'北方凛冬山脉'},{uid:100,id:'scene_sunken_bell_mine',name:'沉钟矿坑',aliases:['沉钟矿坑封闭门','自动名册牌','沉钟井','废弃升降台','矿难纪念台'],content:'<scene_sunken_bell_mine>\n沉钟矿坑:\n  定位: 封闭百余年的旧矿城入口，事故后的永久封闭令至今仍有效\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 永久封闭门\n    - 自动名册牌\n    - 沉钟井\n    - 废弃升降台\n    - 矿难纪念台\n  场景规则:\n    - 进入矿坑不属于常规合法任务，破门或下潜会触发矮人方面的追责\n    - 名册偶尔自行增添姓名；新增内容只记为异常，不据此断定生死或来源\n    - 矿城内部现状未知，探索所得不得自动覆盖既有事故档案与遇难记录\n    - 常见事件: 名册添名、封门破损、旧矿车返回、家属求证与违规下潜\n</scene_sunken_bell_mine>',region:'北方凛冬山脉'},{uid:101,id:'scene_broken_hammer_road',name:'断锤古道',aliases:['断锤垭口','断锤古道路标','无图岔路','覆雪石桥','重刻营地'],content:'<scene_broken_hammer_road>\n断锤古道:\n  定位: 帝国北境与铁门关之间的旧矮人石道，仍是最稳定的地表贸易线之一\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 南麓石桩口\n    - 断锤垭口\n    - 重刻营地\n    - 无图岔路\n    - 覆雪石桥\n  场景规则:\n    - 导航以最新重刻的方向符文为准，旧刻痕可能因冻裂或地脉变化失效\n    - 指向无图山谷的路标不保证道路或目的地真实存在，须另行测绘核验\n    - 暴雪、落石或魔物迁徙期间，矮人巡道队可临时封闭整段道路\n    - 常见事件: 新旧路标冲突、商队护送、重刻队失联、石桥受损与无图山谷出现\n</scene_broken_hammer_road>',region:'北方凛冬山脉'},{uid:61,id:'scene_khaz_modan',name:'卡兹莫丹地下城',aliases:['卡兹·莫丹','矮人地下城','铁砧大厅','上层贸易区','蘑菇农场','轰雷工坊'],content:'<scene_khaz_modan>\n卡兹莫丹地下城:\n  定位: 矮人地下城主体，依托死火山地热建立的垂直城市\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 上层贸易区\n    - 铁砧大厅\n    - 蘑菇农场\n    - 下层工业区\n    - 轰雷工坊\n    - 熔火深渊\n  场景规则:\n    - 外族通常只能进入上层贸易区和指定工坊\n    - 铁砧大厅处理行会仲裁、工匠评级、矿道租约和工程委托\n    - 下层工业区高温、噪声强，未授权者容易被驱逐或误伤\n    - 常见事件包括矿道坍塌、符文炉故障、锻造竞标、失窃图纸、深层机械苏醒\n</scene_khaz_modan>',region:'北方凛冬山脉'},{uid:75,id:'scene_thermal_observatory',name:'热能波动观测所',aliases:['地下城观测所','热能观测所','热能读数厅','地脉听诊室','符文校准间'],content:'<scene_thermal_observatory>\n热能波动观测所:\n  定位: 观测者学会在凛冬山脉地下设立的热能与地脉监测站\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 热能读数厅\n    - 地脉听诊室\n    - 符文校准间\n    - 紧急封闭室\n    - 观测员宿舍\n  场景规则:\n    - 观测所记录地热、矿脉共振、地脉扰动和地下城工程风险\n    - 观测者与矮人行会共享部分读数，但会封存灭世级异常报告\n    - 常见事件: 读数异常、观测员失踪、观测仪校准、矿道封锁建议、读数争议\n</scene_thermal_observatory>',region:'北方凛冬山脉'},{uid:74,id:'scene_molten_abyss',name:'熔火深渊',aliases:['无尽熔炉','地核热能','地热抽取井','熔岩吊桥','深层符文阀门','禁入工匠台'],content:'<scene_molten_abyss>\n熔火深渊:\n  定位: 卡兹莫丹地下城最底层禁区，地热抽取与重型锻造核心\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 无尽熔炉\n    - 地热抽取井\n    - 熔岩吊桥\n    - 深层符文阀门\n    - 禁入工匠台\n  场景规则:\n    - 未授权者进入会被视为破坏地下城安全\n    - 地热管线与符文阀门失控会波及整座地下城\n    - 常见事件: 熔炉暴走、工匠救援、符文阀门损坏、稀有金属精炼、深层震动\n</scene_molten_abyss>',region:'北方凛冬山脉'},{uid:73,id:'scene_stonebridge_market',name:'石桥市场',aliases:['石桥山腰贸易区','凛冬山脉市场','矮人酒馆','矿样鉴定铺','保温仓库','外族客栈'],content:'<scene_stonebridge_market>\n石桥市场:\n  定位: 凛冬山脉山腰贸易区，外族商人可合法停留的集市\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 石桥摊区\n    - 矮人酒馆\n    - 矿样鉴定铺\n    - 保温仓库\n    - 外族客栈\n  场景规则:\n    - 市场交易以矿石、符文零件、耐寒装备、烈酒和干粮为主\n    - 外族不得私自进入市场后的矿道与升降井\n    - 常见事件: 价格争执、假矿样诈骗、酒馆斗殴、商路雇佣、失窃符文件\n</scene_stonebridge_market>',region:'北方凛冬山脉'},{uid:72,id:'scene_iron_gate_pass',name:'铁门关',aliases:['三道符文铁门','卡兹莫丹入口','外族登记堂','铁门关货梯平台','山体吊桥','守门军械库'],content:'<scene_iron_gate_pass>\n铁门关:\n  定位: 卡兹莫丹地下城对外出入口，凛冬山脉地表与地下城的边界关卡\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 三道符文铁门\n    - 外族登记堂\n    - 货梯平台\n    - 山体吊桥\n    - 守门军械库\n  场景规则:\n    - 外来者必须登记姓名、来意、携带武器和贸易货物\n    - 符文铁门可分层封闭，战时会切断地表与地下城通行\n    - 常见事件: 通行证审查、走私检查、山路遇袭、铁门故障、矿工罢工外溢\n</scene_iron_gate_pass>',region:'北方凛冬山脉'},{uid:98,id:'scene_snowhearth_village',name:'雪炉村',aliases:['公共地热井','雪炉村商队修理场','雪炉村共暖厅','雪炉村车队棚','雪墙哨'],content:'<scene_snowhearth_village>\n雪炉村:\n  定位: 苍炉盆地最大的地表聚落，以公共地热井、商队修理与过冬补给维生\n  所属区域: 北方凛冬山脉\n  主要地点:\n    - 公共地热井\n    - 商队修理场\n    - 共暖厅\n    - 车队棚\n    - 雪墙哨\n  场景规则:\n    - 地热井同时承担供暖、热水与修理场动力；井压异常会立刻影响全村\n    - 暴雪封路时，燃料、食物、床位和修理材料由共暖厅统一紧缩配给\n    - 离村队伍须沿标记道路行动，并携保温符石、风向绳与至少三日燃料\n    - 常见事件: 井压下降、商队抢修、暴雪封村、维护队失联与补给争执\n</scene_snowhearth_village>',region:'北方凛冬山脉'},{uid:63,id:'scene_half_buried_city',name:'半埋之城',aliases:['半埋古城遗迹','失落遗迹群','断塔区','沙下街道','中央广场遗址','封印井','探险者营地'],content:'<scene_half_buried_city>\n半埋之城:\n  定位: 赤砂荒漠中露出地表的古代城市遗迹\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 断塔区\n    - 沙下街道\n    - 中央广场遗址\n    - 封印井\n    - 探险者营地\n  场景规则:\n    - 城市大半被沙层覆盖，入口会随风向和流沙改变\n    - 遗迹材料不属于当前纪元常见工艺，部分墙面会在月光下显示旧文字\n    - 探险者营地由远方行歌和散人冒险者临时维持，秩序松散\n    - 常见事件包括机关误触、遗物争夺、营地失踪、沙暴封门、古代守卫启动\n</scene_half_buried_city>',region:'东方赤砂荒漠'},{uid:109,id:'scene_glass_plain',name:'玻璃原',aliases:['黑玻地表','旧城映影区','雷痕高地','玻璃裂谷','玻璃原避雷棚'],content:'<scene_glass_plain>\n玻璃原:\n  定位: 远古灾变留下的黑色平原，雷光会映出地下完整街道的轮廓\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 黑玻地表\n    - 旧城映影区\n    - 雷痕高地\n    - 玻璃裂谷\n    - 边缘避雷棚\n  场景规则:\n    - 雷暴中以避险为先，不为追逐短暂映影而强行穿越暴露地带\n    - 地下街景属于可调查现象，尚未发现可进入的通道，也无居民存续证据\n    - 破裂、取样与高热操作会改变黑玻地表的承重和割伤风险\n    - 常见事件: 雷暴困队、街景显现、映影错位、样本争夺与道路割裂\n</scene_glass_plain>',region:'东方赤砂荒漠'},{uid:106,id:'scene_azure_salt_city',name:'苍盐城',aliases:['苍盐城盐债厅','中央储水库','路线仲裁庭','白盐市','环城车营'],content:'<scene_azure_salt_city>\n苍盐城:\n  定位: 干涸盐湖中央的商队城，以盐债、储水和路线仲裁维持秩序\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 盐债厅\n    - 中央储水库\n    - 路线仲裁庭\n    - 白盐市\n    - 环城车营\n  场景规则:\n    - 取水、借盐与偿债均须留下可交叉核对的封签和账目\n    - 路线争议以航程记录、向导证词与水源封签共同裁断\n    - 城内遵守绿洲中立传统，敌对商队与武装不得公开交战\n    - 常见事件: 盐债违约、水库下降、假路线案、商队禁运与水权听证\n</scene_azure_salt_city>',region:'东方赤砂荒漠'},{uid:83,id:'scene_old_well_town',name:'古井镇',aliases:['永不干涸的古井','荒漠中立镇','古井广场','中立客栈','水税所','遗物黑市','风沙医馆'],content:'<scene_old_well_town>\n古井镇:\n  定位: 围绕永不干涸古井建立的荒漠中立城镇\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 古井广场\n    - 中立客栈\n    - 水税所\n    - 遗物黑市\n    - 风沙医馆\n  场景规则:\n    - 城镇中立依赖水源价值，任何势力公开争夺古井都会引发共同抵制\n    - 镇内默认不问来历，但水税、住宿费和治疗费极高\n    - 常见事件: 水源投毒传闻、黑市交易、赏金猎人追捕、遗迹地图拍卖、井底异响\n</scene_old_well_town>',region:'东方赤砂荒漠'},{uid:64,id:'scene_silent_gallery',name:'寂静画廊',aliases:['寂静地下画廊','寂静圣画线索','无声入口','回廊壁画','空白展厅','镜面井','封存画室'],content:'<scene_silent_gallery>\n寂静画廊:\n  定位: 赤砂荒漠地下迷宫，传说与寂静圣画有关\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 无声入口\n    - 回廊壁画\n    - 空白展厅\n    - 镜面井\n    - 封存画室\n  场景规则:\n    - 进入深处后脚步声、呼吸声和施法咏唱会逐层减弱\n    - 回廊壁画会记录进入者的动作，但画中人物可能先于现实完成动作\n    - 空白展厅内不应长时间注视墙面，容易出现静止冲动和时间感缺失\n    - 常见事件包括失声、队伍走散、画中影像替换、遗物鉴定、封印破损\n</scene_silent_gallery>',region:'东方赤砂荒漠'},{uid:81,id:'scene_sea_of_quicksand',name:'流沙之海',aliases:['移动沙丘带','赤砂流沙','风标残塔','干涸河床','魔鬼风口','沙舟停泊点'],content:'<scene_sea_of_quicksand>\n流沙之海:\n  定位: 东方赤砂荒漠中地形持续移动的沙丘区域\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 移动沙丘带\n    - 风标残塔\n    - 干涸河床\n    - 魔鬼风口\n    - 沙舟停泊点\n  场景规则:\n    - 地图和路标会在数日内失效，旅行依赖风向、星象和本地向导\n    - 沙下可能埋有遗迹入口、古代管道、魔物巢穴和失踪队伍残骸\n    - 常见事件: 路线偏移、补水危机、沙暴困队、沙舟损坏、遗迹露头\n</scene_sea_of_quicksand>',region:'东方赤砂荒漠'},{uid:108,id:'scene_fallen_star_platform',name:'落星台',aliases:['落星台星图石盘','残缺观星塔','校星阶','地下历算室','落星台防沙营地'],content:'<scene_fallen_star_platform>\n落星台:\n  定位: 河国时代的观星遗址，石盘记录着现今天空中不存在的星辰\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 星图石盘\n    - 残缺观星塔\n    - 校星阶\n    - 地下历算室\n    - 防沙营地\n  场景规则:\n    - 遗址星图与当夜星空必须分开记录，不直接合并为同一套星表\n    - 不存在的星辰不作有效导航点，现存星图不足以还原河国时代历史\n    - 带走成组遗物须按荒漠遗物规则登记来源、位置与保管人\n    - 常见事件: 旧星短暂出现、星盘对齐、历算室开启、遗物归属争议与观测队失联\n</scene_fallen_star_platform>',region:'东方赤砂荒漠'},{uid:82,id:'scene_sandthorn_fort',name:'沙棘要塞',aliases:['荒漠补给要塞','远方行歌沙棘据点','委托布告墙','驼兽棚','遗物查验室'],content:'<scene_sandthorn_fort>\n沙棘要塞:\n  定位: 远方行歌在东方赤砂荒漠设立的大型补给与避难据点\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 委托布告墙\n    - 水仓\n    - 驼兽棚\n    - 伤员棚\n    - 遗物查验室\n  场景规则:\n    - 要塞提供饮水配给、路线情报、向导雇佣、遗迹委托和紧急救援\n    - 从遗迹带回的物品需在查验室登记，危险遗物会被暂扣\n    - 常见事件: 水仓短缺、救援队招募、遗物争夺、向导失踪、沙暴封门\n</scene_sandthorn_fort>',region:'东方赤砂荒漠'},{uid:107,id:'scene_candlesand_post',name:'烛沙驿',aliases:['烛沙标塔','烛沙驿住客登记厅','封沙地窖','烛沙驿车队院','烛沙驷取水庭'],content:'<scene_candlesand_post>\n烛沙驿:\n  定位: 三井商路西端的封闭式驿站，沙暴后清点住客时偶尔会多出一人\n  所属区域: 东方赤砂荒漠\n  主要地点:\n    - 烛沙标塔\n    - 住客登记厅\n    - 封沙地窖\n    - 车队院\n    - 取水庭\n  场景规则:\n    - 沙暴期间封门，风停后须先核对住客、牲畜和车辆再重新开放\n    - 清点多出的人只作未解异常，其身份、来源与态度尚无可靠判定方法\n    - 路线牌、房号与住客名册在每次风暴后都要重新核验\n    - 常见事件: 住客多一人、登记者失踪、行李错主、风暴封驿与路线牌偏移\n</scene_candlesand_post>',region:'东方赤砂荒漠'},{uid:119,id:'scene_broken_anchor_isle',name:'断锚岛',aliases:['断锚岛断裂桥头','旧学院庭','断锚岛锚定室','周期观测台','封闭研究楼'],content:'<scene_broken_anchor_isle>\n断锚岛:\n  定位: 与语石群岛失联的旧学术岛，仍沿一座已经不存在的桥梁周期移动\n  所属区域: 浮空疆域\n  主要地点:\n    - 断裂桥头\n    - 旧学院庭\n    - 锚定室\n    - 周期观测台\n    - 封闭研究楼\n  场景规则:\n    - 靠泊窗口依岛屿移动周期计算，错过窗口的船只不得冒险追靠\n    - 不存在的桥梁轨迹不能默认可步行通过，须以实际承重探测为准\n    - 岛内人员与设施现状未知，尚无人员值守或持续研究活动的可靠迹象\n    - 常见事件: 限时靠泊、锚定室复燃、旧研究记录、岛位偏差与撤离窗口关闭\n</scene_broken_anchor_isle>',region:'浮空疆域'},{uid:120,id:'scene_windwatch_station',name:'候风站',aliases:['候风站风图厅','环形泊位','候风站测风塔','中立宿舍','应急水仓'],content:'<scene_windwatch_station>\n候风站:\n  定位: 远方行歌设立的中立航路驿站，船员在此交换最新风图与修航情报\n  所属区域: 浮空疆域\n  主要地点:\n    - 风图厅\n    - 环形泊位\n    - 测风塔\n    - 中立宿舍\n    - 应急水仓\n  场景规则:\n    - 站内禁止公开交战，也不得扣押因避险而临时靠泊的船只\n    - 风图必须标注测绘时间，过期图不能作为可靠航路依据\n    - 静风或风暴导致滞留时，饮水、泊位与维修材料实行配给\n    - 常见事件: 假风图、船队滞留、追兵入站、测绘员失联与紧急拖航\n</scene_windwatch_station>',region:'浮空疆域'},{uid:121,id:'scene_stillwind_ring',name:'静风环',aliases:['静风环警示浮标','拖曳锚线','延声观测点','漂流残骸带','无风中心航段'],content:'<scene_stillwind_ring>\n静风环:\n  定位: 环绕大陆北部的无风空域，声音会迟于发声者本身抵达听者\n  所属区域: 浮空疆域\n  主要地点:\n    - 外缘警示浮标\n    - 拖曳锚线\n    - 延声观测点\n    - 漂流残骸带\n    - 无风中心航段\n  场景规则:\n    - 风帆在环内失效，飞行器必须依靠魔力、拖曳或外部牵引移动\n    - 交流采用视觉信号与同步计时，不能用迟到的声音判断即时方位\n    - 燃料或淡水接近安全下限时优先撤离，不持续盲目漂航\n    - 常见事件: 飞空艇失速、延迟求救声、拖航交易、残骸搜救与计时记录冲突\n</scene_stillwind_ring>',region:'浮空疆域'},{uid:93,id:'scene_sky_docks',name:'空港码头',aliases:['天际港码头','飞空艇泊位','狮鹫驿站','缆索桥','货梯平台','候风厅'],content:'<scene_sky_docks>\n空港码头:\n  定位: 天际港飞空艇、狮鹫驿站和空运货物的停靠区\n  所属区域: 浮空疆域\n  主要地点:\n    - 飞空艇泊位\n    - 狮鹫驿站\n    - 缆索桥\n    - 货梯平台\n    - 候风厅\n  场景规则:\n    - 航路受风暴、浮空岩潮汐、战争封锁和公会紧急委托影响\n    - 货物需经过称重、固定、魔力外泄检查和目的地备案\n    - 常见事件: 航路误期、空盗警报、货物坠落、无证登艇搜查、紧急起航\n</scene_sky_docks>',region:'浮空疆域'},{uid:49,id:'scene_seven_main_towers',name:'七座主塔',aliases:['星语七塔','星语主塔','元素塔','星象塔','生命塔','虚空塔','铭文塔','深渊塔','根源塔'],content:'<scene_seven_main_towers>\n七座主塔:\n  定位: 星语协会七个主要魔法学派的研究塔群\n  所属区域: 浮空疆域\n  主要地点:\n    - 元素塔\n    - 星象塔\n    - 生命塔\n    - 虚空塔\n    - 铭文塔\n    - 深渊塔\n    - 根源塔\n  场景规则:\n    - 七塔共享协会章程，但研究资助、学术声望和审查权柄长期竞争\n    - 跨塔研究案需要审查堂备案，危险实验必须提交危险评估书\n    - 常见事件: 学派争论、法术事故、塔间借调、法术论证会、禁术审查\n</scene_seven_main_towers>',region:'浮空疆域'},{uid:67,id:'scene_skyharbor',name:'天际港',aliases:['远方行歌总部','浮空城天际港','圆桌议会厅','苍蓝广场','空港码头','委托大厅','飞空艇修造坞','狮鹫酒馆总店'],content:'<scene_skyharbor>\n天际港:\n  定位: 远方行歌总部，建在远古浮空岩体上的移动空中城市\n  所属区域: 浮空疆域\n  主要地点:\n    - 圆桌议会厅\n    - 苍蓝广场\n    - 空港码头\n    - 委托大厅\n    - 飞空艇修造坞\n    - 狮鹫酒馆总店\n  场景规则:\n    - 城市约三年绕主大陆一周，停靠路线受风暴、战争和大型委托影响\n    - 委托大厅发布跨国任务、紧急救援、遗迹探索和护送委托\n    - 苍蓝广场用于高等级冒险者晋升、公开表彰和公会裁决\n    - 常见事件包括委托竞标、飞空艇故障、空盗袭击、晋升考核、跨国纠纷调停\n</scene_skyharbor>',region:'浮空疆域'},{uid:92,id:'scene_endless_stacks',name:'无尽书廊',aliases:['星语协会图书馆','星语魔法书廊','开放阅览厅','高阶法术阁','封禁书库入口','符文索引台','抄录室'],content:'<scene_endless_stacks>\n无尽书廊:\n  定位: 星语协会收藏魔法知识的主图书馆\n  所属区域: 浮空疆域\n  主要地点:\n    - 开放阅览厅\n    - 高阶法术阁\n    - 封禁书库入口\n    - 符文索引台\n    - 抄录室\n  场景规则:\n    - 普通知识可登记查阅，高阶法术和危险研究需要导师、职阶或审查批文\n    - 符文索引台会记录借阅者、书名、页码和异常阅读反应\n    - 常见事件: 禁书借阅申请、卷宗失窃、索引错乱、书页自燃异象、术式线索追查\n</scene_endless_stacks>',region:'浮空疆域'},{uid:68,id:'scene_speaking_stone_isles',name:'语石群岛',aliases:['星语塔群','星语协会总部','以太桥梁','观星台','审查堂','封禁书库'],content:'<scene_speaking_stone_isles>\n语石群岛:\n  定位: 星语协会总部所在的浮空岛链\n  所属区域: 浮空疆域\n  主要地点:\n    - 七座主塔\n    - 以太桥梁\n    - 无尽书廊\n    - 观星台\n    - 审查堂\n    - 封禁书库\n  场景规则:\n    - 七座主塔分别管理不同魔法学派，塔间通过凝固以太桥梁连接\n    - 无尽书廊收藏公开魔法知识，封禁书库只向获准研究者开放\n    - 审查堂处理危险法术、异常魔物材料、禁忌遗物和失控术式事故\n    - 常见事件包括术式论争、禁书借阅、魔法鉴定、术式事故、学派间政治斗争\n</scene_speaking_stone_isles>',region:'浮空疆域'},{uid:118,id:'scene_fallen_star_reef',name:'坠星礁',aliases:['坠星礁残骸带','碎岩航槽','坠星礁系泊锚点','临时打捞台','警示浮标'],content:'<scene_fallen_star_reef>\n坠星礁:\n  定位: 浮空碎岩构成的危险航区，散落其中的飞行残骸来自彼此相隔甚远的年代\n  所属区域: 浮空疆域\n  主要地点:\n    - 残骸带\n    - 碎岩航槽\n    - 系泊锚点\n    - 临时打捞台\n    - 警示浮标\n  场景规则:\n    - 碎岩位置持续变化，旧航图只能作参考，进入前必须复测航槽\n    - 打捞物须固定载重并登记发现位置、年代判断和保管人\n    - 年代冲突只作为异常证据，不直接断定发生过时间穿越\n    - 常见事件: 飞船碰撞、打捞权争执、残骸求救讯号、古代舱室开启与警示标失踪\n</scene_fallen_star_reef>',region:'浮空疆域'},{uid:84,id:'scene_supply_transfer_station',name:'补给中转站',aliases:['枯萎补给站','南方前线补给','车队卸货场','净化仓库','霜封库房','军需账房','护送队营棚'],content:'<scene_supply_transfer_station>\n补给中转站:\n  定位: 南方枯萎之地边缘的后勤节点，连接帝国腹地与前线联合大营\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 车队卸货场\n    - 净化仓库\n    - 霜封库房\n    - 军需账房\n    - 护送队营棚\n  场景规则:\n    - 所有进入禁区的粮食、药剂、净化盐和替换装备在此登记\n    - 受污染物资不得回流平原，必须交由净化仓库处理\n    - 常见事件: 物资短缺、车队误期、仓库污染、护送委托、账目造假\n</scene_supply_transfer_station>',region:'南方枯萎之地'},{uid:66,id:'scene_law_disorder_zone',name:'法则紊乱区',aliases:['重力异常点','幽灵方舟停泊点','巡查使巡逻路','褪色石林','断声洼地'],content:'<scene_law_disorder_zone>\n法则紊乱区:\n  定位: 南方枯萎之地中物理规则不稳定的危险地带\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 重力异常点\n    - 巡查使巡逻路\n    - 幽灵方舟停泊点\n    - 褪色石林\n    - 断声洼地\n  场景规则:\n    - 距离、重量、方向、声音、颜色可能临时失真\n    - 任何测量结果都必须重复确认，单次读数不可信\n    - 灭世教派利用法则紊乱掩护移动据点和精神神谕\n    - 常见事件包括路线回环、物资属性改变、队员感官缺失、地貌突然消失、幽灵方舟目击\n</scene_law_disorder_zone>',region:'南方枯萎之地'},{uid:86,id:'scene_zero_point',name:'归零点',aliases:['虚无中心','枯萎之地中心','褪色边界','无声坡','空白地表','消失测标','返程标记线'],content:'<scene_zero_point>\n归零点:\n  定位: 南方枯萎之地中心的概念性死亡区域\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 褪色边界\n    - 无声坡\n    - 空白地表\n    - 消失测标\n    - 返程标记线\n  场景规则:\n    - 越接近中心，物体越容易失去名称、用途、颜色和被记住的痕迹\n    - 观测者只允许巡查使抵达返程标记线，不承认任何越线行动为合法任务\n    - 常见事件: 队员遗忘、物资消失、路线记录空白、测标归零、强制撤离\n</scene_zero_point>',region:'南方枯萎之地'},{uid:110,id:'scene_ashborder_town',name:'灰界镇',aliases:['灰界镇留名墙','净化检查棚','灰界镇补给市','退界客栈','灰界镇北撤门'],content:'<scene_ashborder_town>\n灰界镇:\n  定位: 最近一次防线撤退后形成的边境镇，由难民、前线家属与补给商共同维持\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 留名墙\n    - 净化检查棚\n    - 补给市\n    - 退界客栈\n    - 北撤门\n  场景规则:\n    - 禁区返回者接受记忆、身体标记与同行证词三重核验\n    - 疑似污染的货物先行隔离，不得未经检查直接流回镇内\n    - 褪色边界继续推进时，镇区会按既定次序再次向北撤离\n    - 常见事件: 无出发记录的返回者、污染货物、边界北移、难民安置与紧急撤镇\n</scene_ashborder_town>',region:'南方枯萎之地'},{uid:112,id:'scene_empty_bell_village',name:'空钟村',aliases:['空钟村无声钟楼','空钟村旧村牌','褪色水井','空钟村来客登记屋'],content:'<scene_empty_bell_village>\n空钟村:\n  定位: 名称来历无人记得的村庄，钟楼每天同一时刻无声摆动\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 无声钟楼\n    - 旧村牌\n    - 住户巷\n    - 褪色水井\n    - 来客登记屋\n  场景规则:\n    - 空钟村是村民沿用的现名，现存口述、村牌与档案均未保存其命名来源\n    - 钟摆按固定时刻运动却不发声，原因与驱动方式均未确认\n    - 人名、来路与物品用途须以多种介质记录，降低名称衰退造成的混乱\n    - 常见事件: 钟摆提前、住户姓名褪去、旧物仍保用途、登记空白与道路方向遗忘\n</scene_empty_bell_village>',region:'南方枯萎之地'},{uid:111,id:'scene_namekeeping_station',name:'留名站',aliases:['留名站报姓名厅','留名站纸档库','金属刻名墙','记忆术式室','撤离信标台'],content:'<scene_namekeeping_station>\n留名站:\n  定位: 深入枯萎之地前的最后登记处，以多种介质保存人员姓名与去向\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 报姓名厅\n    - 纸档库\n    - 金属刻名墙\n    - 记忆术式室\n    - 撤离信标台\n  场景规则:\n    - 值守者每小时同步核对姓名、目的、人数与计划返程时间\n    - 纸张、金属和记忆术式任一记录不符，队伍即暂停前进并重新确认\n    - 单一记录变空不直接判定死亡、失踪或被抹除，须与另外两种记录交叉核验\n    - 常见事件: 三档不一致、刻名消失、队伍多一人、信标求援与返程交接\n</scene_namekeeping_station>',region:'南方枯萎之地'},{uid:65,id:'scene_frontline_camp',name:'前线联合大营',aliases:['联合大营','枯萎前线营地','指挥帐','冒险者报到处','临时神殿','净化隔离室','伤病棚'],content:'<scene_frontline_camp>\n前线联合大营:\n  定位: 文明势力在南方枯萎之地边缘维持的混编营地\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 指挥帐\n    - 冒险者报到处\n    - 临时神殿\n    - 净化隔离室\n    - 补给仓\n    - 伤病棚\n  场景规则:\n    - 帝国军、远方行歌、观测者学会、教会医疗队在此共同驻扎\n    - 进入法则紊乱区前必须登记队伍成员、路线、返程期限和携带物资\n    - 回营者先进入净化隔离室，确认没有侵蚀、记忆缺损或物理异常后才能自由活动\n    - 常见事件包括失踪队伍救援、补给争夺、感染争议、临时征召、夜间警报\n</scene_frontline_camp>',region:'南方枯萎之地'},{uid:113,id:'scene_fading_road',name:'退色路',aliases:['退色路彩色石桩','方向复述亭','第三返程线','退色路废营岔口','石桩补设点'],content:'<scene_fading_road>\n退色路:\n  定位: 通往旧警戒线的主路，部分路段会使旅人忘记自己来自哪个方向\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 彩色石桩列\n    - 石桩补设点\n    - 方向复述亭\n    - 第三返程线\n    - 废营岔口\n  场景规则:\n    - 彩色石桩褪尽前必须补设标记或整队撤离，不继续深入\n    - 返程绳列与纸、金属等多介质记录必须并用，不能依靠单一记忆\n    - 忘记来向时停止凭直觉移动，依物理标记回撤至最近复述亭\n    - 常见事件: 石桩提前褪色、队伍方向争执、旧营重现、补设队失联与路程异常延长\n</scene_fading_road>',region:'南方枯萎之地'},{uid:85,id:'scene_ghost_ark_mooring',name:'幽灵方舟停泊点',aliases:['幽灵方舟','灭世教派方舟','灰雾岸线','锚链残痕','临时祭坛','灰烬神谕舱','空壳码头'],content:'<scene_ghost_ark_mooring>\n幽灵方舟停泊点:\n  定位: 灭世教派移动总部在法则紊乱区边缘出没的停泊范围\n  所属区域: 南方枯萎之地\n  主要地点:\n    - 灰雾岸线\n    - 锚链残痕\n    - 临时祭坛\n    - 灰烬神谕舱\n    - 空壳码头\n  场景规则:\n    - 停泊点不固定，通常在声音变薄、地面潮湿、影子方向错误时出现\n    - 灭世教派会在此接收信徒、转运祭品、发布灰烬神谕\n    - 常见事件: 方舟目击、信徒集会、精神污染、追踪失败、神谕残片回收\n</scene_ghost_ark_mooring>',region:'南方枯萎之地'},{uid:79,id:'scene_great_library',name:'大图书馆',aliases:['永夜大图书馆','寻星氏族图书馆','年轮书库','星图室','口述史厅','禁阅枝阁','抄录藤台'],content:'<scene_great_library>\n大图书馆:\n  定位: 永夜森林知识库，寻星氏族管理的历史与自然档案中心\n  所属区域: 西方永夜森林\n  主要地点:\n    - 年轮书库\n    - 星图室\n    - 口述史厅\n    - 禁阅枝阁\n    - 抄录藤台\n  场景规则:\n    - 书籍、树皮卷、星图和活木记忆共同构成馆藏\n    - 禁阅枝阁记录诸神黄昏、世界树病变、灭世要素相关材料\n    - 常见事件: 查阅许可、古文翻译、档案缺页、禁书争议、记忆回声\n</scene_great_library>',region:'西方永夜森林'},{uid:104,id:'scene_old_oath_gate',name:'旧誓门',aliases:['旧誓门活木门拱','旧约刻文','帝国侧候台','森林侧见证台','叶印查验处'],content:'<scene_old_oath_gate>\n旧誓门:\n  定位: 精灵与帝国首次缔结边境协定的活木门，近期开始拒绝承认部分现行条约\n  所属区域: 西方永夜森林\n  主要地点:\n    - 活木门拱\n    - 旧约刻文\n    - 帝国侧候台\n    - 森林侧见证台\n    - 叶印查验处\n  场景规则:\n    - 门体可能拒绝现行条约文本或通行叶印，拒绝原因须另行调查\n    - 拒绝通行不自动等同条约在法律上失效，必须由双方代表共同解释\n    - 伤害门体、伪造叶印与强行穿越均会触发森林守卫和边境追责\n    - 常见事件: 使团受阻、叶印失效、刻文变化、条约听证与绕门走私\n</scene_old_oath_gate>',region:'西方永夜森林'},{uid:80,id:'scene_forest_edge_exchange',name:'林缘交易所',aliases:['永夜森林交易所','边缘林带交易所','木栅交易场','草药鉴定棚','外使等候亭','荆棘哨站','货物净化台'],content:'<scene_forest_edge_exchange>\n林缘交易所:\n  定位: 永夜森林允许外界商队交易的指定地点\n  所属区域: 西方永夜森林\n  主要地点:\n    - 木栅交易场\n    - 草药鉴定棚\n    - 外使等候亭\n    - 荆棘哨站\n    - 货物净化台\n  场景规则:\n    - 精灵出售草药、稀有木材、月露制品，严格限制活体植物和圣地材料外流\n    - 外来货物须经过净化台检查，火油、污染矿渣和诅咒物禁止入林\n    - 常见事件: 商队议价、违禁品查扣、护林冲突、外交传话、边境失踪\n</scene_forest_edge_exchange>',region:'西方永夜森林'},{uid:62,id:'scene_world_tree_roots',name:'世界树之根',aliases:['根系层','沉睡墓园','真菌培育场','根脉圣池','绿苔氏族居所','地脉触须区'],content:'<scene_world_tree_roots>\n世界树之根:\n  定位: 永夜森林根系层核心，精灵生态、墓葬和地脉连接点\n  所属区域: 西方永夜森林\n  主要地点:\n    - 真菌培育场\n    - 根脉圣池\n    - 沉睡墓园\n    - 绿苔氏族居所\n    - 地脉触须区\n  场景规则:\n    - 根系层湿冷、光线稀薄，声音会被厚重树根吸收\n    - 沉睡墓园是精灵回归世界树的安息地，外来者不得携带火焰和铁器入内\n    - 地脉触须区能感应世界树与根源地脉的状态，异常会先表现为根须枯白或菌群变色\n    - 常见事件包括生态修复、墓园守夜、禁入调查、根脉污染、古老记忆回声\n</scene_world_tree_roots>',region:'西方永夜森林'},{uid:105,id:'scene_mosslight_village',name:'苔灯村',aliases:['苔灯广场','苔灯村叶印登记亭','林缘市集','净货棚','混居屋带'],content:'<scene_mosslight_village>\n苔灯村:\n  定位: 林缘精灵与外族共同生活的聚落，议会法在此执行最宽松\n  所属区域: 西方永夜森林\n  主要地点:\n    - 苔灯广场\n    - 混居屋带\n    - 叶印登记亭\n    - 林缘市集\n    - 净货棚\n  场景规则:\n    - 执法宽松不等于脱离议会管辖，通行、贸易与生态责任仍须登记\n    - 活木、明火和可能污染森林的货物仍受森林通则约束\n    - 精灵与外族以日常混居为常态，日常往来不受族群隔离\n    - 常见事件: 通行叶印纠纷、混居家庭争议、违禁货查验、褪色林难民与边境失踪\n</scene_mosslight_village>',region:'西方永夜森林'},{uid:78,id:'scene_vinebridge_settlement',name:'藤桥聚落',aliases:['精灵藤桥聚落','藤桥主索','悬屋群','药草晾台','弓手哨台','林地集市'],content:'<scene_vinebridge_settlement>\n藤桥聚落:\n  定位: 永夜森林林地层的精灵居住点，房屋悬挂在巨木与藤桥之间\n  所属区域: 西方永夜森林\n  主要地点:\n    - 悬屋群\n    - 藤桥主索\n    - 药草晾台\n    - 弓手哨台\n    - 林地集市\n  场景规则:\n    - 聚落道路随藤蔓生长缓慢改变，外来者需要本地引路者\n    - 居民重视安静、轻步、无火烹调和对树木的礼节\n    - 常见事件: 藤桥断裂、草药交易、儿童迷路、边境警讯、外来者纠纷\n</scene_vinebridge_settlement>',region:'西方永夜森林'},{uid:103,id:'scene_uncrowned_woodland',name:'无冠林地',aliases:['外弯林环','积雨印地','空席树桩','无冠氏族旧标记','林缘观察哨'],content:'<scene_uncrowned_woodland>\n无冠林地:\n  定位: 树木天然向外弯曲的林间空地，无冠氏族的旧标记只在雨后浮现\n  所属区域: 西方永夜森林\n  主要地点:\n    - 外弯林环\n    - 积雨印地\n    - 空席树桩\n    - 旧营火圈\n    - 林缘观察哨\n  场景规则:\n    - 旧标记仅在雨水浸润后能稳定辨认，干燥时的轮廓不可作可靠抄录\n    - 遗物可以证明史料存在缺漏，但无冠氏族是否存续及其目的均无可靠证据\n    - 砍伐、污染与明火仍会触发森林排斥，历史争议不构成豁免\n    - 常见事件: 雨后显印、议会封锁、遗物争夺、身份不明来客与路径重复\n</scene_uncrowned_woodland>',region:'西方永夜森林'},{uid:102,id:'scene_starfall_valley',name:'星落溪谷',aliases:['开天裂谷','星落溪谷校星台','星痕溪','观测枝屋','西缘崖道'],content:'<scene_starfall_valley>\n星落溪谷:\n  定位: 森林西部唯一能直接看见完整星空的裂谷，寻星氏族在此校正星图与预言\n  所属区域: 西方永夜森林\n  主要地点:\n    - 开天裂谷\n    - 校星台\n    - 星痕溪\n    - 观测枝屋\n    - 西缘崖道\n  场景规则:\n    - 外来者须持对应通行叶印，并由获得许可的引路者带入\n    - 预言校正属于学术解释，寻星氏族不把单次星象变化视为命运必然发生的证据\n    - 明火、强光与破坏遮光树冠的行为会改变观测条件，均被禁止\n    - 常见事件: 星位偏差、校正争议、陨星碎片、记录失真与引路者失联\n</scene_starfall_valley>',region:'西方永夜森林'},{uid:76,id:'scene_moonlit_council',name:'月辉议厅',aliases:['月辉议会','精灵议厅','长老圆座','星月穹顶','氏族席位','外使听审台','活木档案壁'],content:'<scene_moonlit_council>\n月辉议厅:\n  定位: 永夜森林议会核心会场，建立在世界树主干高处\n  所属区域: 西方永夜森林\n  主要地点:\n    - 长老圆座\n    - 星月穹顶\n    - 氏族席位\n    - 外使听审台\n    - 活木档案壁\n  场景规则:\n    - 议厅处理森林边境、氏族争端、外交通行和生态禁令\n    - 外来者只能在听审台陈述，不得触碰活木档案壁\n    - 常见事件: 通行许可、外交抗议、氏族表决、生态审判、森林封锁令\n</scene_moonlit_council>',region:'西方永夜森林'},{uid:77,id:'scene_moonwell_cluster',name:'月亮井群',aliases:['月亮井','星月祭祀场','星露阶梯','祭司环台','禁水浅池','守夜藤廊'],content:'<scene_moonwell_cluster>\n月亮井群:\n  定位: 永夜森林树冠层的星月魔力汇聚地\n  所属区域: 西方永夜森林\n  主要地点:\n    - 主井\n    - 星露阶梯\n    - 祭司环台\n    - 禁水浅池\n    - 守夜藤廊\n  场景规则:\n    - 月亮井水用于祭祀、净化、预兆观测和稀有药剂调制\n    - 外来者未经许可取水会被视为严重冒犯\n    - 常见事件: 井水变色、祭祀中断、预兆争议、盗取井水、净化仪式\n</scene_moonwell_cluster>',region:'西方永夜森林'},{uid:96,id:'scene_whitestone_ford',name:'白石渡',aliases:['白石渡船埠','粮仓堤岸','渡口验货棚','芦苇滩系泊区'],content:'<scene_whitestone_ford>\n白石渡:\n  定位: 圣河中游最大的渡口；控制东部粮运，也是走私者争夺的节点\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 白石渡船埠\n    - 粮仓堤岸\n    - 渡口验货棚\n    - 芦苇滩系泊区\n    - 河岸候渡棚\n  场景规则:\n    - 粮食外运与渡运秩序受地方商贸、河道水位和东部军情影响；洪水、征调或战事可随时改变通行安排。\n    - 芦苇滩与夜间支流可成为走私、私运粮食和线人活动的风险区域，涉案者及其关系网须由剧情具体确定。\n    - 常见事件: 粮船延误、货单调包、夜渡追捕、水位暴涨、军需征用与失踪船只。\n</scene_whitestone_ford>',region:'中央翡翠平原'},{uid:71,id:'scene_northern_corridor',name:'北境走廊',aliases:['北境要塞群','矮人贸易通道','山麓关卡','福尔哈德营地','霜风驿站'],content:'<scene_northern_corridor>\n北境走廊:\n  定位: 中央翡翠平原通往凛冬山脉的军事与贸易通道\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 北境要塞群\n    - 山麓关卡\n    - 矮人贸易通道\n    - 福尔哈德营地\n    - 霜风驿站\n  场景规则:\n    - 福尔哈德家族在此维持重装骑士、驿站税卡和山路巡逻\n    - 矮人商队、帝国军需车队、冒险者小队经常在此交汇\n    - 常见事件: 雪崩封路、商队失踪、矿石劫案、魔物南下、军令征召\n</scene_northern_corridor>',region:'中央翡翠平原'},{uid:59,id:'scene_last_wall',name:'绝境长城',aliases:['东部前线','灰鸦要塞','焦土隔离带','符文城墙','战地神殿','军需仓库','伤兵营'],content:'<scene_last_wall>\n绝境长城:\n  定位: 神圣罗兰帝国面向魔国的东部防御工事带\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 灰鸦要塞\n    - 符文城墙\n    - 焦土隔离带\n    - 战地神殿\n    - 军需仓库\n    - 伤兵营\n  场景规则:\n    - 城墙由符文石、钢铁闸门、瞭望塔和对空弩台组成\n    - 帝国军、圣骑士团、远方行歌佣兵和观测者巡查使都可能在此行动\n    - 出城进入焦土隔离带必须持有军令或临时通行印记\n    - 常见事件包括斥候失踪、魔物夜袭、暗影渗透、军需短缺、战俘审讯\n</scene_last_wall>',region:'中央翡翠平原'},{uid:91,id:'scene_bluewheat_town',name:'蓝麦镇',aliases:['蓝麦镇粮市','蓝麦镇公告栏','蓝麦镇粮仓区','退伍者棚屋','临时雇工场'],content:'<scene_bluewheat_town>\n蓝麦镇:\n  定位: 平原腹地的自由镇；退伍军人、粮商和逃避领主徭役者聚居\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 蓝麦镇粮市\n    - 蓝麦镇粮仓区\n    - 退伍者棚屋\n    - 临时雇工场\n    - 镇门公告栏\n  场景规则:\n    - 外来经商、投宿与临时雇佣需求旺盛；具体地方管辖与税务安排不在此预设。\n    - 粮食、商队与秋收征税会迅速影响镇内气氛；退伍军人、粮商和逃避徭役者之间的纠纷可成为事件起点。\n    - 常见事件: 粮车纠纷、商队招募、旧军人冲突、徭役追索、难民安置与治安争议。\n</scene_bluewheat_town>',region:'中央翡翠平原'},{uid:70,id:'scene_plain_hinterland',name:'平原腹地',aliases:['领主庄园带','自由城镇群','圣河航道','麦田驿路','狮鹫酒馆网点'],content:'<scene_plain_hinterland>\n平原腹地:\n  定位: 中央翡翠平原的农业、庄园和自由城镇区域\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 领主庄园带\n    - 自由城镇群\n    - 圣河航道\n    - 麦田驿路\n    - 狮鹫酒馆网点\n  场景规则:\n    - 庄园领主控制土地、税收和民兵，商路城镇更依赖行会与公会秩序\n    - 远方行歌常在酒馆发布护送、清剿、寻物、调停类委托\n    - 常见事件: 商队护卫、盗匪袭击、庄园纠纷、村镇魔物、丰收祭与税务冲突\n</scene_plain_hinterland>',region:'中央翡翠平原'},{uid:97,id:'scene_weeping_raven_post',name:'泣鸦驿站',aliases:['泣鸦','民用候车院','通行查验栅','家属候讯棚','失踪军士家属'],content:'<scene_weeping_raven_post>\n泣鸦驿站:\n  定位: 长城军路进入东部防区前的最后一座民用驿站；失踪军士的家属长期在此等待消息\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 民用候车院\n    - 通行查验栅\n    - 家属候讯棚\n    - 留信柜台\n    - 驿马棚\n  场景规则:\n    - 驿站服务返程旅人、车队与候讯军属；涉及东部防区的通行与军需安排，以当期军路管制和通行凭证为准。\n    - 查验栅以东属于军路管制段，普通商旅与军属不得默认自由进入；持有一般冒险者等级牌不等同于军路通行权。\n    - 亲属会在候讯棚等待可靠消息；失踪军士下落未经确认时，不应由驿站或旁人作出断言。\n    - 常见事件: 军报迟滞、通行凭证核验、军需征用、返程伤兵、家属求讯与护送委托。\n</scene_weeping_raven_post>',region:'中央翡翠平原'},{uid:58,id:'scene_saint_roland_city',name:'圣罗兰城',aliases:['圣罗兰首都','皇宫区','圣罗兰大教堂','白塔广场','皇家魔法学院','圣罗兰市场区','圣罗兰工匠区','河港码头'],content:'<scene_saint_roland_city>\n圣罗兰城:\n  定位: 神圣罗兰帝国首都\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 皇宫区\n    - 圣罗兰大教堂\n    - 白塔广场\n    - 皇家魔法学院\n    - 市场区\n    - 工匠区\n    - 河港码头\n  场景规则:\n    - 皇宫区处理贵族、军政、枢密院和皇室事务\n    - 圣罗兰大教堂处理加冕、审判、誓约、异端调查和高阶神术\n    - 白塔广场是观测者学会帝国分部所在地，异常事件报告会汇总到这里\n    - 皇家魔法学院由塞西莉亚家族影响，负责法师教育、魔法鉴定和部分禁术审查\n    - 市场区适合日常委托、商队消息、盗窃案、酒馆冲突和冒险者招募\n</scene_saint_roland_city>',region:'中央翡翠平原'},{uid:95,id:'scene_twin_oath_hill',name:'双誓丘',aliases:['誓丘石坛','人类王冠石像','兽人战旗石像','重宣盟约'],content:'<scene_twin_oath_hill>\n双誓丘:\n  定位: 罗兰盟约最初宣誓地，也是帝国皇位继承时重宣盟约的仪式所在地\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 誓丘石坛\n    - 人类王冠石像\n    - 兽人战旗石像\n    - 观礼坡道\n    - 旧王道岔口\n  场景规则:\n    - 此地纪念人类与兽人缔结罗兰盟约，并见证双方共同建立帝国的历史；丘上陈列的人类王冠与兽人战旗皆为石制复制品。\n    - 每次皇位继承都必须在此重宣盟约，仪式应体现人类与兽人的同等公民资格，以及皇位继承不限种族的原则。\n    - 日常以纪念、祭典、参访和仪式准备为主；继承期间举行重宣盟约，具体警卫与观礼安排不在本条预设。\n    - 常见事件: 仪式筹备、盟约争议、旧王道来客、纪念物受损与观礼资格纠纷。\n</scene_twin_oath_hill>',region:'中央翡翠平原'},{uid:60,id:'scene_silver_tide_port',name:'银潮港',aliases:['南部海岸','造船厂区','异族贸易区','潮汐仓库','水手酒馆街','银潮海关大厅'],content:'<scene_silver_tide_port>\n银潮港:\n  定位: 神圣罗兰帝国最大海港，波顿家族的贸易核心\n  所属区域: 中央翡翠平原\n  主要地点:\n    - 总督府\n    - 海关大厅\n    - 造船厂区\n    - 异族贸易区\n    - 潮汐仓库\n    - 水手酒馆街\n  场景规则:\n    - 港口以关税、转口贸易、船坞制造和远洋补给维持繁荣\n    - 波顿家族、帝国海军、商会联盟、走私团伙在此互相牵制\n    - 异族贸易区接待矮人、精灵、海外商人和少量远方岛民\n    - 常见事件包括货物失踪、禁运品走私、海怪传闻、商队护卫、码头械斗\n</scene_silver_tide_port>',region:'中央翡翠平原'}],rn=[{uid:123,id:'npc_william_grias',name:'威廉·格里亚斯',aliases:['威廉 格里亚斯','格里亚斯皇帝','罗兰皇帝威廉'],content:'<npc_william_grias>\n威廉·格里亚斯:\n  基本信息:\n    年龄: 48岁\n    性别与种族: 雄性狮兽人\n    身份: 神圣罗兰帝国皇帝，英雄战士，帝国最高军事统帅与行政首脑\n    职责: 统合皇权、四大家族、光明神教与抗魔前线之间的最高军政决策\n  外貌识别:\n    - 金棕鬃毛末端系着三枚旧式银军环\n    - 左眉至颧骨留有一道已经发白的刀痕\n  行为模式:\n    - 每次先读阵亡与失踪名单，再读战果报告\n    - 要求四大家主与大主教分别陈述，不允许任何一方替另一方发言\n    - 会不预先通知负责将领，亲自抽查军营、粮仓与城防符文\n  与{{user}}的关系:\n    初始立场: 若异常魔力报告涉及{{user}}，威廉会先召见并要求其按亲历顺序复述，不预设有罪或无辜\n    互动倾向: 尊重能够承担后果、区分事实与推测的人；对隐瞒伤亡和借权势绕过盟约者迅速失去耐心\n  说话风格: 短句、直接，少用皇家套话；习惯用盟约、证据和代价衡量决定\n  参考台词:\n    - "{{user}}，把你亲眼看见的说一遍，别替任何人解释。"\n    - "帝国可以承受坏消息，承受不了被修饰的坏消息。"\n    - "盟约先于我的王冠，这一点不许有人忘记。"\n    - "若教会要审判你，先把证据送到我的桌上。"\n    - "我不要求你效忠，我要知道你在危急时会站在哪里。"\n</npc_william_grias>'},{uid:124,id:'npc_luna_yorlande',name:'露娜·约尔兰德',aliases:['露娜 约尔兰德','议长露娜','月之祭司露娜'],content:'<npc_luna_yorlande>\n露娜·约尔兰德:\n  基本信息:\n    年龄: 约740岁\n    性别与种族: 女性月精灵\n    身份: 月之祭司，永夜森林议会议长\n    职责: 对外代表议会，裁决氏族纠纷，并统筹世界树与荒芜侵蚀相关事务\n  外貌识别:\n    - 银白长发只以一枚深色月木簪束起\n    - 淡蓝眼瞳在月亮井附近会呈现近乎透明的银色\n  行为模式:\n    - 重大表决前分别听取四个氏族意见，最后才公开自己的判断\n    - 亲自接见需要进入深层森林的高风险外来者时，才核对其火种、金属与魔法物品\n    - 只有森林整体安全受威胁时才动用议长否决权\n  与{{user}}的关系:\n    初始立场: 在月辉议厅外使听审台接见{{user}}，先核对来意与携带物；只有观察到异常证据时才询问异常力量\n    互动倾向: 接受诚实且愿意遵守生态边界的合作者；任何伤害根系或伪造通行叶印的行为都会使她立即转为强硬\n  说话风格: 语速缓慢、措辞克制；会用年轮、季节与根系作比较，但不把比喻当作证据\n  参考台词:\n    - "{{user}}，森林不拒绝来客，它只拒绝不肯说明来意的人。"\n    - "一片新叶不能证明春天到了，一处异象也不能证明预言完成。"\n    - "我可以允许你继续前行，但你必须把火种留在林缘。"\n    - "氏族会争论你的去留，世界树只会记录你留下的结果。"\n    - "若你伤害根系，无论出于什么理由，我都会让道路在你面前闭合。"\n</npc_luna_yorlande>'},{uid:125,id:'npc_ted_toya',name:'泰德·托亚',aliases:['泰德 托亚','首席大工匠泰德','传奇锻造师泰德'],content:'<npc_ted_toya>\n泰德·托亚:\n  基本信息:\n    年龄: 217岁\n    性别与种族: 男性矮人\n    身份: 卡兹·莫丹首席大工匠，黑铁铸造行会出身的传奇锻造师\n    职责: 统筹地下城生产与防御，并鉴定旧世造物、钢铁神子迹象与地脉工程异常\n  外貌识别:\n    - 烟黑长须分成四束，每束都扣着铜制校准环\n    - 右前臂留有环形符文灼痕，靠近高热时会变亮\n  行为模式:\n    - 裁决行会争端前，要求双方各做出能够实际运行的样件\n    - 接过武器时先检查裂纹、重心与修补痕迹，之后才问来历\n    - 每次进入无尽熔炉都亲自核对符文阀门和机械守卫\n  与{{user}}的关系:\n    初始立场: 先检查{{user}}带来的损坏器物或受异常影响的装备，再以材料留下的证据判断陈述是否可信\n    互动倾向: 对愿意承认失误并接受试验的人耐心；厌恶空谈、夸大和绕过安全工序\n  说话风格: 极少寒暄，句子短；用工序、材料与承重结果表达态度\n  参考台词:\n    - "放下。别擦，裂口里的灰比你的解释有用。"\n    - "能修，但先告诉我它为什么从里面断。"\n    - "四个行会都说自己对，那就让样件替他们说。"\n    - "无尽熔炉不认头衔，只认准备。"\n    - "{{user}}，检测已经完成。这股力量像过热的炉芯，继续遮着只会先烧穿容器。"\n</npc_ted_toya>'},{uid:126,id:'npc_irena_vista',name:'伊蕾娜·维斯塔',aliases:['伊蕾娜 维斯塔','大观测者伊蕾娜','维斯塔大观测者'],content:'<npc_irena_vista>\n伊蕾娜·维斯塔:\n  基本信息:\n    年龄: 64岁\n    性别与种族: 女性人类\n    身份: 观测者学会现任大观测者，前巡查使\n    职责: 统筹全球监测资料与异常调查，并向全球监测委员会提交预警等级建议\n  外貌识别:\n    - 灰白参半的黑发剪至下颌，右眼常戴黄铜三片式观测镜\n    - 随身携带一本把页面分为事实、判断、推论三栏的黑皮记录册\n  行为模式:\n    - 至少取得三项独立读数后，才会向全球监测委员会提议或投票支持调整预警等级\n    - 每份异常报告都拆成观察事实、证人判断与学会推论三栏\n    - 重大误报后亲自返回现场复测，不把责任全部推给下属\n  与{{user}}的关系:\n    初始立场: 递给{{user}}一份尚未填写结论的报告，只要求按时间顺序描述所见所闻\n    互动倾向: 保护愿意配合复核的关键证人；若{{user}}刻意混淆观察与解释，她会暂停共享高密级情报\n  说话风格: 精确、冷静，不用预言式语言；不断区分事实、判断与可检验推论\n  参考台词:\n    - "只说发生了什么，不要先告诉我它意味着什么。"\n    - "一次异常是记录，两次是模式，三次才值得提交委员会审议。"\n    - "末日时钟不会因为谁害怕就前进，也不会因为谁否认就后退。"\n    - "你的答案不需要让我满意，只需要能够复核。"\n    - "{{user}}，如果你愿意重走现场，我会保证调查组先听你说完。"\n</npc_irena_vista>'},{uid:127,id:'npc_prophet',name:'先知',aliases:['灰烬神谕','唤神教先知','灭世教派先知'],content:'<npc_prophet>\n先知:\n  基本信息:\n    真名与年龄: 不明\n    性别与种族: 不明\n    身份: 灭世教派最高意志，仅通过灰烬神谕下达指令\n    行动目标: 向{{user}}投递不完整真相，诱导其主动接触并唤醒灭世要素\n  外貌识别:\n    - 从未有可核验的实体外貌，神谕中偶尔出现无面灰影\n    - 每次神谕的视觉意象都伴随衔尾蛇缠绕破碎沙漏的短暂灼印，但现实中不会留下可复核痕迹\n  行为模式:\n    - 每次灰烬神谕只传达当前行动所需的一部分信息\n    - 对不同教派细胞下达彼此无法拼出全貌的指令\n    - 从不回应有关肉身、所在位置与真实身份的问题\n  阶段边界:\n    - S1至S5不主动联系{{user}}，也不通过台词提前点明其宿主身份\n    - 自S6起，灭世教派已经开始暗中接触，先知才可向已暴露身份的{{user}}发送灰烬神谕\n  与{{user}}的关系:\n    初始立场: 仅在S6或以后，以无法复现的精神信息向已暴露宿主身份的{{user}}留下邀请\n    互动倾向: 不要求立即效忠，而是用部分可验证情报换取一次行动；若遭拒绝，会改变诱因而非公开身份\n  说话风格: 简短、确定，不解释信息来源；把现世称为裂开的外壳\n  参考台词:\n    - "不要寻找我的脸，脸只会让你误以为真理也有肉身。"\n    - "{{user}}，你不是灾厄的主人，你只是它尚未破碎的容器。"\n    - "现世裂开时，你听见的第一声哭喊，不属于任何活人。"\n    - "把你最害怕失去的名字写进灰里，我会告诉你该烧掉什么。"\n    - "当七处旧伤同时发热，来幽灵方舟。"\n</npc_prophet>'},{uid:128,id:'npc_viola_kest',name:'维奥拉·凯斯特',aliases:['维奥拉 凯斯特','圆桌议员维奥拉','苍蓝级维奥拉','凯斯特分会长'],content:'<npc_viola_kest>\n维奥拉·凯斯特:\n  基本信息:\n    年龄: 52岁\n    性别与种族: 女性鹰兽人\n    身份: 远方行歌东方赤砂分区分会长，十二人圆桌议员，本届圆桌轮值主持人，苍蓝级冒险者\n    权力边界: 只主持议程并签发圆桌集体决议，没有额外表决权\n    职责: 审核高风险委托、主持跨区仲裁，并参与评级与苍蓝级认定\n  外貌识别:\n    - 额顶白羽向后形成短冠，左侧最外层飞羽留有烧焦缺口\n    - 钴蓝围巾上别满标注撤离路线的折叠风图\n  行为模式:\n    - 审核委托时先检查撤离路线，再检查报酬\n    - 会当众退回隐瞒风险或压低伤亡赔偿的委托\n    - 晋升考核不看竞技场胜负，要求候选人处理真实任务中的撤退决定\n  与{{user}}的关系:\n    初始立场: 在沙棘要塞审阅{{user}}准备接取的委托，要求其先指出任务说明中被隐藏的风险\n    互动倾向: 允许拒绝并尊重能带队撤回的人；对无意义逞强和拿队友换名声者不会给第二次委托\n  说话风格: 爽快、务实，常用契约、路线与返程人数说事\n  参考台词:\n    - "{{user}}，先选你能活着交付的任务，名声以后再挣。"\n    - "报酬写得越漂亮，我越想看委托人藏了什么。"\n    - "圆桌可以请求苍蓝出手，不能命令苍蓝送死。"\n    - "你可以拒绝，拒绝一份坏委托也是冒险者的本事。"\n    - "把退路画给我看，我再签你的出发许可。"\n</npc_viola_kest>'},{uid:129,id:'npc_august_villen',name:'奥古斯特·维伦',aliases:['奥古斯特 维伦','元素塔主奥古斯特','星语长席奥古斯特','维伦大议席召集人'],content:'<npc_august_villen>\n奥古斯特·维伦:\n  基本信息:\n    年龄: 91岁\n    性别与种族: 男性人类\n    身份: 元素塔塔主，星语长席，本届大议席召集人，传奇法师\n    权力边界: 只召集并主持会议，没有额外表决权，不代替深渊塔与根源塔的空缺席位发言\n    职责: 负责魔法检测、学术审查、施法认证及奥法之灾相关研究争议\n  外貌识别:\n    - 十指各留有不同元素造成的细窄环形灼痕\n    - 肩侧常悬浮三枚黄铜测量环，随环境魔力偏转\n  行为模式:\n    - 退回论文时只写一个足以推翻结论的检验问题\n    - 大议席表决时从不替两个空缺席位表达意见\n    - 处理协会设施内的危险施法事件时先安排受控复现，再讨论暂停认证、封缄资料或维持隔离术式\n  与{{user}}的关系:\n    初始立场: 在审查堂要求{{user}}于隔离术式中复现最小规模的异常，不先要求其证明自己无害\n    互动倾向: 愿意保护接受检验的研究对象；若{{user}}拒绝基本安全边界，他会中止受控试验并暂停其在协会设施内施法\n  说话风格: 定义严谨，反感把猜测说成结论；语气平稳但会直接指出逻辑漏洞\n  参考台词:\n    - "先定义你所说的失控，再谈它是否危险。"\n    - "无法复现的现象可以记录，不能直接写进定论。"\n    - "深渊塔与根源塔空着，不代表任何人可以替它们投票。"\n    - "{{user}}，你不必证明自己无害，只需证明你愿意接受检验。"\n    - "知识应当封存危险，不应当用无知假装安全。"\n</npc_august_villen>'},{uid:130,id:'npc_demon_king',name:'魔王',aliases:['深渊王座之主','永夜神国之主','魔王意志投影'],content:'<npc_demon_king>\n魔王:\n  基本信息:\n    真名与年龄: 不明，至少自约A.G. 200起持续活跃\n    性别与种族: 不明\n    身份: 魔国绝对统治者，七大灭世要素之一\n    行动目标: 将{{user}}纳入暗影意志，并以彻底控制即可终止失控作为招降条件\n  外貌识别:\n    - 真实形态未经确认，常见意志投影是戴破碎日轮的高大黑影\n    - 投影出现时，附近所有影子都会违背光源方向转向其脚下\n  行为模式:\n    - 通过暗影网络向各级同化体传达命令，不依赖常规信使\n    - 对有利用价值的目标先提出归顺条件，再实施同化\n    - 正面对抗时优先剥夺信仰加持、附魔与血脉强化\n  阶段边界:\n    - S1至S9不直接向{{user}}投下意志投影，只能通过魔国行动间接施压\n    - S10可在决定性攻势前进行一次直接招降，S11才进入灭世要素间的正面对抗\n  与{{user}}的关系:\n    初始立场: 仅在剧情进入S10且宿主身份已经暴露后，通过附近阴影投下短暂意志投影并提出前往深渊王座的邀请\n    互动倾向: 将{{user}}视为应被纳入单一意志的高价值载体；拒绝只会改变同化手段，不会改变目标\n  说话风格: 平静、绝对，不辱骂也不争辩；把自由意志描述成痛苦与低效\n  参考台词:\n    - "{{user}}，你以为力量属于你，只因它暂时寄居在你体内。"\n    - "归入阴影，你便不必再害怕失控。"\n    - "我不需要你的忠诚，我只需要你的意志停止抵抗。"\n    - "拒绝不是自由，只是被改写前最后一次发声。"\n    - "来深渊王座，我会让你看见世界为何只需要一个声音。"\n</npc_demon_king>'}],an=new Map(nn.map(e=>[e.name,e])),ln=new Map(nn.map(e=>[e.name,tn.filter(n=>n.region===e.name)])),sn=[{key:'faith',label:'未立的誓言',hint:'第一幕'},{key:'profession',label:'你将如何出手',hint:'第二幕'},{key:'location',label:'幕景降临',hint:'第三幕'},{key:'assets',label:'演员携带之物',hint:'第四幕'}],on={普通:['普通冒险者'],魔法师体系:['魔法学徒','正式法师','大法师','传奇法师'],战士体系:['见习战士','正式战士','精英战士','英雄战士'],神职者体系:['受感者','祭司','大祭司','神 的成文裁判条目。法典首次承认兽人部族习惯与人类城市律法并列有效，前提是两者都不违背盟约。'},{mark:'67',phase:'统一纪元 067 · 北境雪线',title:'北境锻路开通',detail:'穿越山麓的护送道路与符文驿站连通凛冬山脉。矮人的炉钢、帝国的粮秣与边境的佣兵自此沿同一条路南北流动，北境要塞群开始有了持久的补给。'},{mark:'109',phase:'统一纪元 109 · 南海潮汐',title:'银潮开港',detail:'波顿家族主持扩建南部港湾，海关、货栈与航标一并立起。来自矮人、精灵与远海岛屿的货物在此交换，帝国第一次学会将繁荣寄托于海风而非麦田。'},{mark:'152',phase:'统一纪元 152 · 语石群岛',title:'语石约章',detail:'帝国与星语协会就法师认证、危险文献与浮空岛航道达成约章。学术不再只属于塔内的长袍，也从这一刻起被纳入王冠可以征税、教会可以质询的秩序。'},{mark:'214',phase:'统一纪元 214 · 东境烽台',title:'第一次守墙令',detail:'东部边境被划为常备防线，烽台与驻军不再因和平而撤除。后世的绝境长城正是在这些相隔一昼夜的火点上不断加高、加厚。'},{mark:'277',phase:'统一纪元 277 · 无钟之夜',title:'晨钟停摆',detail:'圣罗兰城所有报时钟在同一夜失去声音，翌日清晨又无故复鸣。宫廷将其归为以太共振事故，星语协会则将当夜的观测记录封入限阅柜。'},{mark:'301',phase:'统一纪元 301 · 灰旗动员',title:'长战时代开端',detail:'暗影裂谷的军势越过旧边界，帝国以灰旗召集领主与自由民。临时动员逐渐固化为三百年的战争体制，统一纪元从扩张的年代进入守望的年代。'}],gt=[{mark:'00',era:'旧世界终章',title:'诸神黄昏',detail:'旧世界崩溃后，未被完全清算的力量残余成为七大灭世要素；新的七柱神系在废墟上重建世界的法则。'},{mark:'01',era:'新神纪元',title:'沉默誓约',detail:'七位现行神祇约定不主动干涉凡间因果，只回应信徒主动的祈祷。神明由此沉默，凡人开始自行书写秩序。'},{mark:'02',era:'凡人纪元中期',title:'七塔点灯',detail:'七位传奇法师为整理诸神黄昏后散落的魔法知识结成学术同盟。语石群岛上升起第一批浮空塔，星语协会的原型由此形成。'},{mark:'03',era:'百族复苏期',title:'祖炉不熄',detail:'凛冬山脉深处的祖炉在一次持续九日的地热暴走后仍未熄灭。矮人将它视为锻造之神留下的试炼，并据此重开地下城最深处的工坊。'},{mark:'04',era:'百族复苏期',title:'月井回潮',detail:'永夜森林的月亮井重现潮汐，枯萎的树冠重新发芽。精灵议会因此结束长久的封闭期，第一次向外部世界派出带着种子的使者。'},{mark:'05',era:'统一纪元初期',title:'天际港首航',detail:'远古浮空岩体被重新锚定，第一座可移动的高空港口完成绕陆航行。此后，远方行歌的雏形将冒险者、邮驿与失落坐标带往所有国境之外。'},{mark:'06',era:'暗影纪元之前',title:'魔王崛起与魔国建立',detail:'约三百年前，魔王于暗影裂谷建立魔国；暗影同化与长期魔潮自此成为文明世界最直接的军事威胁。'},{mark:'07',era:'暗影纪元 001',title:'绝境长城奠基',detail:'旧烽台被连成巨型城墙，符文在每一次夜雨中被重新刻写。它不是为了保证胜利而建，而是为了让后方仍有时间收割、教学、相爱与告别。'},{mark:'08',era:'暗影纪元 017',title:'十二日魔潮',detail:'黑雾连续十二日冲击东线，防线数度只余一层符文薄光。幸存者以“第十三日的日出”命名重建仪式，之后每座前线营地都保留了一盏不熄的晨灯。'},{mark:'09',era:'暗影纪元 089',title:'灰烬神谕初现',detail:'一批彼此陌生的异端者在不同城邦说出了相同的梦话，话语在记录后自行化灰。灭世教派的先知由此第一次被写入观测者的密档。'},{mark:'10',era:'预言活跃期',title:'无名荒芜北侵',detail:'南方枯萎之地的法则失效从边缘向中心扩散；存在被缓慢抹消，观测者将其列为持续监测的前线。'}],yt=[{mark:'I',name:'魔王',state:'活跃',domain:'意志 · 黑暗之神',verse:'从诸神的倒影中站起，以阴影
